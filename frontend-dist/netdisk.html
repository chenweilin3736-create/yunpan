const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files, uploadTargetDir);
});

function handleFileSelect(event) {
  handleFiles(event.target.files, uploadTargetDir);
  event.target.value = ''; // reset
}

async function handleFolderSelect(event) {
  const files = Array.from(event.target.files);
  event.target.value = ''; // reset
  if (!files.length) return;

  // 上传文件夹时，根据 webkitRelativePath 保持目录结构
  // webkitRelativePath 格式: "选中的根文件夹/内部路径/文件名"
  // 我们去掉根文件夹名，保留内部目录结构，再拼接到 uploadTargetDir
  const baseTarget = uploadTargetDir;

  for (const file of files) {
    const relativePath = file.webkitRelativePath || '';
    let fileTargetDir = baseTarget;

    if (relativePath) {
      const parts = relativePath.split('/');
      // 去掉文件名和根文件夹名，保留中间目录结构
      if (parts.length > 2) {
        const subDir = parts.slice(1, -1).join('/');
        fileTargetDir = baseTarget ? `${baseTarget}/${subDir}` : subDir;
      }
      // 如果只有根文件夹+文件，则直接上传到 baseTarget
    }

    await uploadFile(file, fileTargetDir);
  }
}

async function handleFiles(fileList, targetDir) {
  for (const file of fileList) {
    await uploadFile(file, targetDir);
  }
}

async function uploadFile(file, targetDir) {
  const uploadId = `upload-item-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
  const isChunked = file.size > CHUNK_SIZE;
  
  // 断点续传: 检查是否有未完成的上传
  let resumedUploadId = null;
  let resumedCompletedChunks = [];
  if (isChunked) {
    const resumeInfo = getResumeInfo(file);
    if (resumeInfo) {
      // 查询后端该上传会话是否还有效,以及已完成的分片
      try {
        const resp = await apiFetch(`${API_BASE}/api/manage/chunkStatus?uploadId=${resumeInfo.uploadId}&totalChunks=${totalChunks}`, {
          headers: getAuthHeaders()
        });
        if (resp.valid && resp.completedCount > 0 && resp.completedCount < totalChunks) {
          resumedUploadId = resumeInfo.uploadId;
          resumedCompletedChunks = resp.completedChunks;
          showToast(`检测到未完成的上传,从 ${resp.completedCount}/${totalChunks} 继续`, 'info');
        } else if (resp.valid && resp.completedCount === totalChunks) {
          // 所有分片已完成,直接合并
          showToast('所有分片已上传,正在合并...', 'info');
          // 走正常合并流程
        } else {
          // 会话过期,清除记录
          clearResumeInfo(file);
        }
      } catch (e) {
        console.warn('检查断点续传失败:', e.message);
      }
    }
  }
  
  // 创建上传项 UI
  const uploadList = document.getElementById('uploadList');
  const item = document.createElement('div');
  item.className = 'upload-item';
  item.id = uploadId;
  const initialPercent = resumedCompletedChunks.length > 0 ? (resumedCompletedChunks.length / totalChunks * 95) : 0;
  const initialStatus = resumedCompletedChunks.length > 0 ? `续传中 ${resumedCompletedChunks.length}/${totalChunks}` : (isChunked ? `${formatSize(file.size)} · 分片上传 ${totalChunks} 片` : `${formatSize(file.size)} · 直传`);
  item.innerHTML = `
    <div style="font-size:1.5rem">${getFileIcon(file.name)}</div>
    <div class="upload-item-info">
      <div class="upload-item-name">${escapeHtml(file.name)}</div>
      <div class="upload-item-status">${initialStatus}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${initialPercent}%"></div></div>
    </div>
    <div class="upload-item-status" style="min-width:60px;text-align:right">${Math.round(initialPercent)}%</div>
    ${resumedUploadId ? `<button class="btn-icon" onclick="cancelResume('${escapeHtml(file.name)}')" title="取消续传" style="margin-left:8px">✕</button>` : ''}
  `;
  uploadList.appendChild(item);
  
  const updateProgress = (percent, status, done = false, error = false) => {
    const fill = item.querySelector('.progress-fill');
    const statusEl = item.querySelectorAll('.upload-item-status')[1];
    fill.style.width = percent + '%';
    if (done) fill.classList.add('success');
    if (error) fill.classList.add('error');
    statusEl.textContent = Math.round(percent) + '%';
    if (status) item.querySelectorAll('.upload-item-status')[0].textContent = status;
  };
  
  try {
    if (isChunked) {
      await chunkedUpload(file, totalChunks, updateProgress, resumedUploadId, resumedCompletedChunks, targetDir);
    } else {
      await directUpload(file, updateProgress, targetDir);
    }
    updateProgress(100, '上传完成', true);
    showToast(`${file.name} 上传成功`, 'success');
    // 上传成功,清除续传记录
    if (isChunked) clearResumeInfo(file);
  } catch (err) {
    updateProgress(0, '失败: ' + err.message, false, true);
    showToast(`${file.name} 上传失败: ${err.message}`, 'error');
  }
  
  // 3秒后移除成功项
  setTimeout(() => {
    if (item.querySelector('.progress-fill').classList.contains('success')) {
      item.style.transition = 'opacity 0.5s';
      item.style.opacity = '0';
      setTimeout(() => item.remove(), 500);
    }
  }, 3000);
}

// ============================
// 断点续传: localStorage 管理
// ============================
function getResumeInfo(file) {
  try {
    const key = `resume_${file.name}_${file.size}`;
    const data = localStorage.getItem(key);
    if (!data) return null;
    const info = JSON.parse(data);
    // 超过 50 分钟的记录视为过期(后端会话 1 小时过期)
    if (Date.now() - info.timestamp > 50 * 60 * 1000) {
      localStorage.removeItem(key);
      return null;
    }
    return info;
  } catch {
    return null;
  }
}

function saveResumeInfo(file, uploadId) {
  try {
    const key = `resume_${file.name}_${file.size}`;
    localStorage.setItem(key, JSON.stringify({
      uploadId,
      timestamp: Date.now()
    }));
  } catch (e) {
    console.warn('保存续传信息失败:', e.message);
  }
}

function clearResumeInfo(file) {
  try {
    const key = `resume_${file.name}_${file.size}`;
    localStorage.removeItem(key);
  } catch {}
}

function cancelResume(fileName) {
  if (!confirm('取消续传? 将清除该文件的上传进度记录')) return;
  // 清除所有匹配该文件名的续传记录
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const key = localStorage.key(i);
    if (key && key.startsWith('resume_') && key.includes(fileName)) {
      localStorage.removeItem(key);
    }
  }
  showToast('已取消续传,重新选择文件将重新上传', 'info');
}

async function chunkedUpload(file, totalChunks, updateProgress, resumedUploadId = null, completedChunks = [], targetDir = null) {
  const effectiveDir = targetDir !== null ? targetDir : currentDir;
  // Step 1: 初始化(或复用已有会话)
  let uploadId;
  const completedSet = new Set(completedChunks);
  
  if (resumedUploadId) {
    // 断点续传: 复用已有的 uploadId
    uploadId = resumedUploadId;
    updateProgress((completedSet.size / totalChunks) * 95, `续传中 ${completedSet.size}/${totalChunks}`);
  } else {
    // 新上传: 初始化
    updateProgress(0, '初始化上传...');
    let formData = new FormData();
    formData.append('originalFileName', file.name);
    formData.append('originalFileType', file.type || 'application/octet-stream');
    formData.append('totalChunks', totalChunks);
    
    const initResp = await apiFetch(`${API_BASE}/upload?initChunked=true&uploadChannel=telegram`, {
      method: 'POST', body: formData, headers: getAuthHeaders()
    });
    
    uploadId = initResp.uploadId;
  }
  
  // 保存续传信息到 localStorage
  saveResumeInfo(file, uploadId);
  
  // Step 2: 逐片上传(并发 2 片,大文件降低并发避免超时)
  let uploadedCount = completedSet.size;
  updateProgress((uploadedCount / totalChunks) * 95, uploadedCount > 0 ? `上传中 ${uploadedCount}/${totalChunks}` : `上传中 0/${totalChunks}`);
  const concurrency = totalChunks > 100 ? 2 : 3;
  let nextChunk = 0;
  const failedChunks = [];
  
  // 上传单个分片(带409冲突处理和幂等性支持)
  async function uploadSingleChunkWithRetry(chunkIndex, chunkBlob, maxRetry = 5) {
    let retry = 0;
    while (retry < maxRetry) {
      try {
        const chunkFormData = new FormData();
        chunkFormData.append('file', chunkBlob);
        chunkFormData.append('chunkIndex', chunkIndex);
        chunkFormData.append('totalChunks', totalChunks);
        chunkFormData.append('uploadId', uploadId);
        chunkFormData.append('originalFileName', file.name);
        chunkFormData.append('originalFileType', file.type || 'application/octet-stream');
        
        // 使用 fetch 直接调用,以便处理 409 等特殊状态码
        const resp = await fetch(`${API_BASE}/upload?chunked=true&uploadChannel=telegram`, {
          method: 'POST', body: chunkFormData, credentials: 'include',
          headers: getAuthHeaders()
        });
        const text = await resp.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }
        
        if (resp.ok) {
          // 上传成功(包括 alreadyCompleted 幂等性返回)
          uploadedCount++;
          const percent = (uploadedCount / totalChunks) * 95;
          updateProgress(percent, `上传中 ${uploadedCount}/${totalChunks}`);
          return true;
        }
        
        if (resp.status === 409 && data?.inProgress) {
          // 分片正在上传中(服务端正在处理),等待后重试
          const waitSec = data.retryAfter || 10;
          console.log(`分片 ${chunkIndex + 1} 服务端正在上传,等待 ${waitSec}s...`);
          await new Promise(r => setTimeout(r, waitSec * 1000));
          retry++;
          continue;
        }
        
        throw new Error(data?.error || data?.message || `HTTP ${resp.status}`);
      } catch (err) {
        retry++;
        if (retry >= maxRetry) {
          console.warn(`分片 ${chunkIndex + 1} 失败 ${retry} 次,稍后重试: ${err.message}`);
          return false;
        }
        // 指数退避: 2s, 4s, 8s, 16s
        await new Promise(r => setTimeout(r, 2000 * Math.pow(2, retry - 1)));
      }
    }
    return false;
  }
  
  async function uploadOneChunk() {
    while (nextChunk < totalChunks) {
      const chunkIndex = nextChunk++;
      
      // 断点续传: 跳过已完成的分片
      if (completedSet.has(chunkIndex)) {
        continue;
      }
      
      const start = chunkIndex * CHUNK_SIZE;
      const end = Math.min(start + CHUNK_SIZE, file.size);
      const chunkBlob = file.slice(start, end);
      
      const success = await uploadSingleChunkWithRetry(chunkIndex, chunkBlob);
      if (!success) {
        failedChunks.push(chunkIndex);
      }
    }
  }
  
  // 并发上传
  const workers = [];
  for (let i = 0; i < concurrency; i++) workers.push(uploadOneChunk());
  await Promise.all(workers);
  
  // 重试之前失败的分片:先查询服务端实际状态,避免盲目重试导致重复上传
  if (failedChunks.length > 0) {
    updateProgress(95, `检查失败分片状态 ${failedChunks.length}/${totalChunks}...`);
    console.log(`查询 ${failedChunks.length} 个失败分片的服务端状态...`);
    
    // 查询服务端实际已完成分片
    let serverCompletedChunks = [];
    try {
      const statusResp = await apiFetch(`${API_BASE}/manage/chunkStatus?uploadId=${encodeURIComponent(uploadId)}&totalChunks=${totalChunks}`, {
        headers: getAuthHeaders()
      });
      if (statusResp && statusResp.valid && Array.isArray(statusResp.completedChunks)) {
        serverCompletedChunks = statusResp.completedChunks;
      }
    } catch (e) {
      console.warn('查询服务端分片状态失败,将直接重试:', e.message);
    }
    
    // 过滤出真正需要重试的分片(服务端未完成的)
    const chunksToRetry = failedChunks.filter(idx => !serverCompletedChunks.includes(idx));
    const serverCompletedCount = failedChunks.length - chunksToRetry.length;
    
    if (serverCompletedCount > 0) {
      console.log(`服务端已有 ${serverCompletedCount} 个分片完成,跳过重试`);
      uploadedCount += serverCompletedCount;
      updateProgress((uploadedCount / totalChunks) * 95, `跳过已完成 ${uploadedCount}/${totalChunks}`);
    }
    
    if (chunksToRetry.length === 0) {
      console.log('所有失败分片在服务端已完成,无需重试');
    } else {
      updateProgress(95, `重试失败分片 ${chunksToRetry.length}/${totalChunks}...`);
      console.log(`重试 ${chunksToRetry.length} 个失败分片...`);
      
      for (const chunkIndex of chunksToRetry) {
        const start = chunkIndex * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, file.size);
        const chunkBlob = file.slice(start, end);
        
        const success = await uploadSingleChunkWithRetry(chunkIndex, chunkBlob, 3);
        if (!success) {
          throw new Error(`分片 ${chunkIndex + 1} 重试 3 次后仍失败`);
        }
      }
    }
  }
  
  // Step 3: 合并
  updateProgress(96, '合并文件中...');
  const mergeFormData = new FormData();
  mergeFormData.append('uploadId', uploadId);
  mergeFormData.append('totalChunks', totalChunks);
  mergeFormData.append('originalFileName', file.name);
  mergeFormData.append('originalFileType', file.type || 'application/octet-stream');
  
  // 上传目录
  let mergeUrl = `${API_BASE}/upload?chunked=true&merge=true&uploadChannel=telegram&uploadNameType=origin`;
  if (effectiveDir) {
    mergeFormData.append('uploadFolder', effectiveDir);
  }
  
  // 合并请求也可能超时,加重试
  let mergeRetry = 0;
  const maxMergeRetry = 3;
  while (mergeRetry < maxMergeRetry) {
    try {
      await apiFetch(mergeUrl, {
        method: 'POST', body: mergeFormData, headers: getAuthHeaders()
      });
      break;
    } catch (err) {
      mergeRetry++;
      if (mergeRetry >= maxMergeRetry) throw new Error(`文件合并失败: ${err.message}`);
      updateProgress(96, `合并重试 ${mergeRetry}/${maxMergeRetry}...`);
      await new Promise(r => setTimeout(r, 3000 * mergeRetry));
    }
  }
  
  updateProgress(99, '完成');
}

async function directUpload(file, updateProgress, targetDir = null) {
  const effectiveDir = targetDir !== null ? targetDir : currentDir;
  updateProgress(0, '上传中...');
  const formData = new FormData();
  formData.append('file', file);
  
  let url = `${API_BASE}/upload?uploadNameType=origin&uploadChannel=telegram`;
  if (effectiveDir) url += `&uploadFolder=${encodeURIComponent(effectiveDir)}`;
  
  // 使用 XMLHttpRequest 跟踪进度
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) {
        updateProgress((e.loaded / e.total) * 95, '上传中...');
      }
    });
    xhr.addEventListener('load', () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const resp = JSON.parse(xhr.responseText);
          if (Array.isArray(resp) && resp.length > 0 && resp[0].src) {
            resolve(resp);
          } else {
            reject(new Error(resp.error || '上传失败'));
          }
        } catch { reject(new Error('解析响应失败')); }
      } else {
        reject(new Error(`HTTP ${xhr.status}`));
      }
    });
    xhr.addEventListener('error', () => reject(new Error('网络错误')));
    xhr.open('POST', url);
    
    // 添加认证头
    const authHeaders = getAuthHeaders();
    for (const [key, val] of Object.entries(authHeaders)) {
      xhr.setRequestHeader(key, val);
    }
    xhr.send(formData);
  });
}

      <div class="file-name">${escapeHtml(fileName)}</div>

async function createShare() {
  if (!shareContext) return;
  const password = document.getElementById('sharePassword').value.trim() || undefined;
  const expiresIn = parseInt(document.getElementById('shareExpiry').value) || undefined;
  const downloadLimit = parseInt(document.getElementById('shareLimit').value) || undefined;
  
  closeModal();
  
  try {
    const resp = await apiFetch(`${API_BASE}/api/manage/share/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
      body: JSON.stringify({
        fileId: shareContext.fileId,
        password,
        expiresIn: expiresIn > 0 ? expiresIn : undefined,
        downloadLimit
      })
    });
    
    // 显示分享链接
    const expiryText = resp.expiresAt ? `有效期至 ${formatDate(resp.expiresAt)}` : '永久有效';
    const limitText = resp.downloadLimit ? ` · 最多下载 ${resp.downloadLimit} 次` : '';
    showModal('✅ 分享链接已创建', `
      <div class="share-result-card">
        <div class="result-icon">🔗</div>
        <div class="result-title">${escapeHtml(shareContext.fileName)}</div>
        ${password ? `<div class="result-password">访问密码: <strong>${escapeHtml(password)}</strong></div>` : ''}
        <div style="font-size:0.78rem;color:var(--muted);margin-top:0.3rem">${expiryText}${limitText}</div>
      </div>
      <div class="share-link-box">
        <input type="text" class="share-link-input" id="shareLinkInput" value="${resp.shareUrl}" readonly>
        <button class="btn btn-primary btn-sm" onclick="copyShareLink()">📋 复制</button>
      </div>
    `, [
      { text: '关闭', class: 'btn-outline', onclick: closeModal }
    ]);
  } catch (err) {
    showToast('创建分享失败: ' + err.message, 'error');
  }
}

function copyShareLink() {
  const input = document.getElementById('shareLinkInput');
  input.select();
  document.execCommand('copy');
  showToast('链接已复制', 'success');
}

async function loadShares() {
  const container = document.getElementById('sharesContainer');
  container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">加载中...</div>';
  
  try {
    const data = await apiFetch(`${API_BASE}/api/manage/share/`, {
      headers: getAuthHeaders()
    });
    
    const shares = data.shares || [];
    if (shares.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔗</div><div>暂无分享链接</div><div style="font-size:0.8rem;margin-top:0.5rem">在文件列表中点击分享按钮即可创建</div></div>';
      return;
    }
    
    let html = '';
    shares.forEach(share => {
      const expired = share.expiresAt && Date.now() > share.expiresAt;
      const expiryText = share.expiresAt ? formatDate(share.expiresAt) : '永久有效';
      const badgeClass = expired ? 'expired' : 'active';
      const badgeText = expired ? '已过期' : '有效';
      const pwdBadge = share.password ? '<span class="share-card-badge has-pwd">🔒 有密码</span>' : '';
      
      html += `<div class="share-card">
        <div class="share-card-icon">${getFileIcon(share.fileName)}</div>
        <div class="share-card-info">
          <div class="share-card-name">${escapeHtml(share.fileName)}</div>
          <div class="share-card-meta">
            <span>📅 ${formatDate(share.createdAt)}</span>
            <span>⏱️ ${expiryText}</span>
            <span>⬇️ ${share.downloadCount || 0}${share.downloadLimit ? '/' + share.downloadLimit : ''} 次</span>
          </div>
        </div>
        <span class="share-card-badge ${badgeClass}">${badgeText}</span>
        ${pwdBadge}
        <div class="share-card-actions">
          <button class="btn-icon" onclick="event.stopPropagation();copyShareUrl('${share.shareId}')" title="复制链接">📋</button>
          <button class="btn-icon" onclick="event.stopPropagation();deleteShare('${share.shareId}')" title="删除" style="color:var(--danger)">🗑️</button>
        </div>
      </div>`;
    });
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>加载失败: ${err.message}</div></div>`;
  }
}

function copyShareUrl(shareId) {
  const url = `${location.origin}/s/${shareId}`;
  navigator.clipboard.writeText(url).then(() => showToast('链接已复制', 'success'));
}

async function deleteShare(shareId) {

// ============================
// 密码强度校验（与后端逻辑一致）
// ============================
const COMMON_WEAK_PASSWORDS = [
  'password','12345678','123456789','11111111','00000000','12341234',
  'qwerty123','abc12345','password1','iloveyou','admin123','letmein1'
];
function checkPasswordStrength(password) {
  const suggestions = [];
  if (!password) {
    return { score: 0, label: '空', valid: false, suggestions: ['请输入密码'] };
  }
  // 长度检查
  if (password.length < 8) {
    suggestions.push('密码至少 8 位');
  }
  // 字符类型统计
  const types = [
    /[a-z]/.test(password),     // 小写字母
    /[A-Z]/.test(password),     // 大写字母
    /[0-9]/.test(password),     // 数字
    /[^a-zA-Z0-9]/.test(password) // 特殊符号
  ].filter(Boolean).length;
  if (types < 3) {
    suggestions.push('建议包含大写字母、小写字母、数字、符号中的至少 3 种');
  }
  // 常见弱密码
  if (COMMON_WEAK_PASSWORDS.includes(password.toLowerCase())) {
    suggestions.push('避免使用常见弱密码');
  }
  // 计分
  let score = 0;
  if (password.length >= 8) score++;
  if (password.length >= 12) score++;
  if (types >= 3) score++;
  if (types >= 4) score++;
  if (!COMMON_WEAK_PASSWORDS.includes(password.toLowerCase())) score++;
  // 严重不足时扣分
  if (password.length < 8) score = Math.min(score, 1);
  if (types < 2) score = Math.min(score, 1);
  score = Math.max(0, Math.min(4, score));
  const valid = password.length >= 8 && types >= 2 && !COMMON_WEAK_PASSWORDS.includes(password.toLowerCase());
  const labels = ['很弱', '弱', '一般', '良好', '强'];
  const label = labels[score] || '很弱';
  return { score, label, valid, suggestions: suggestions.length ? suggestions : ['密码强度合格'] };
}

function updatePasswordStrength(inputId) {
  const input = document.getElementById(inputId);
  const box = document.getElementById('passwordStrengthIndicator');
  if (!input || !box) return;
  const pwd = input.value;
  if (!pwd) { box.innerHTML = ''; return; }
  const { score, label, valid, suggestions } = checkPasswordStrength(pwd);
  const cls = ['weak','weak','fair','good','strong'][score] || 'weak';
  const widthPct = (score === 0 ? 12 : score * 25);
  const icon = valid ? '✓' : '⚠️';
  box.innerHTML = `
    <div class="password-strength">
      <div class="password-strength-bar"><div class="password-strength-fill ${cls}" style="width:${widthPct}%"></div></div>
      <div class="password-strength-text ${cls}">${icon} 强度：${label}</div>
      <div class="password-strength-hints">${suggestions.join('；')}</div>
    </div>`;
}

async function do2FAVerify(challenge) {
  const token = document.getElementById('twofaTokenInput')?.value.trim();
  const backupCode = document.getElementById('twofaBackupInput')?.value.trim();
  const useBackup = !document.getElementById('twofaBackupField').classList.contains('hidden');
  if (useBackup) {
    if (!backupCode) { showToast('请输入备用码', 'warning'); return; }
  } else {
    if (!token || token.length !== 6) { showToast('请输入 6 位验证码', 'warning'); return; }
  }
  const body = { challenge };
  if (useBackup) body.backupCode = backupCode; else body.token = token;
  try {
    const resp = await apiFetch(`${API_BASE}/api/manage/2fa?action=verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (resp && resp.success) {
      closeModal();
      const ctx = pending2FA || {};
      pending2FA = null;
      const welcome = ctx.loginType === 'sub'
        ? `欢迎, ${resp.displayName || ctx.username || ''}`
        : '登录成功';
      // 合并 loginAlert（首次登录响应或验证响应都可能携带）
      const alertFlag = !!(ctx.loginAlert || resp.loginAlert);
      onLoggedIn({ loginAlert: alertFlag }, welcome);
    } else {
      showToast('验证失败，请重试', 'error');
    }
  } catch (err) {
    showToast('验证失败: ' + err.message, 'error');
  }
}

// ============================
// 端到端加密（E2EE）基础框架 - Web Crypto API
// ============================
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(salt), iterations: 150000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptFile(file, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = file instanceof ArrayBuffer ? file : await file.arrayBuffer();
  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key,
    data
  );
  // 拼接 iv + 密文，便于解密时拆分
  const merged = new Uint8Array(iv.length + ciphertext.byteLength);
  merged.set(iv, 0);
  merged.set(new Uint8Array(ciphertext), iv.length);
  return merged.buffer;
}

async function decryptFile(encryptedData, key) {
  const buf = encryptedData instanceof ArrayBuffer ? new Uint8Array(encryptedData) : new Uint8Array(encryptedData);
  const iv = buf.slice(0, 12);
  const ciphertext = buf.slice(12);
  const plaintext = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv },
    key,
    ciphertext
  );
  return plaintext;
}

async function toggleE2EE(enabled) {
  if (enabled) {
    // 开启：要求用户设置加密密码并派生密钥
    const password = prompt('请设置端到端加密密码：\n（此密码用于加密/解密文件，服务器不会存储，请务必牢记，丢失后已加密文件无法恢复）');
    if (!password) {
      document.getElementById('e2eeToggle').checked = false;
      return;

    if (password.length < 6) {
      showToast('加密密码至少 6 位', 'warning');
      document.getElementById('e2eeToggle').checked = false;
      return;
    }
    try {
      const salt = (currentUserInfo?.username || 'admin') + '_imgbed_e2ee';
      E2EE_KEY = await deriveKey(password, salt);
      E2EE_ENABLED = true;
      showToast('端到端加密已开启', 'success');
    } catch (err) {
      document.getElementById('e2eeToggle').checked = false;
      E2EE_ENABLED = false;
      E2EE_KEY = null;
      showToast('开启加密失败: ' + err.message, 'error');
    }
  } else {
    E2EE_ENABLED = false;
    E2EE_KEY = null;
    showToast('端到端加密已关闭', 'info');
  }
  loadSecuritySettings();
}

  }

        </div>
        <div class="device-meta">
          <span>👤 ${authLabel}</span>
          <span>🔑 ${escapeHtml(s.tokenPrefix || '****')}</span>

const TAG_COLORS = ['#ef4444','#f97316','#f59e0b','#22c55e','#14b8a6','#3b82f6','#6366f1','#a855f7','#ec4899','#6b7280'];
function getTagColor(tag) {
  let hash = 0;
  for (let i = 0; i < tag.length; i++) hash = tag.charCodeAt(i) + ((hash << 5) - hash);
  return TAG_COLORS[Math.abs(hash) % TAG_COLORS.length];
}
function renderFileTags(tags) {
  if (!tags || !tags.length) return '';
  return tags.slice(0, 3).map(t => `<span class="tag-pill" style="background:${getTagColor(t)}22;color:${getTagColor(t)}">${escapeHtml(t)}</span>`).join('') + (tags.length > 3 ? `<span class="tag-pill" style="background:var(--rule);color:var(--muted)">+${tags.length-3}</span>` : '');
}

function addTagFromModal(fileIdEncoded) {
  const input = document.getElementById('tagInput');
  const tag = input.value.trim();
  if (!tag) return;
  const fileId = decodeURIComponent(fileIdEncoded);
  apiFetch(`${API_BASE}/api/manage/tags/${encodeURIComponent(fileId)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
    body: JSON.stringify({ action: 'add', tags: [tag] })
  }).then(() => {
    input.value = '';
    showTagModal(fileIdEncoded, document.querySelector('#modalBody .file-name, #modalBody div[style*="font-weight:600"]')?.textContent || '');
    loadFiles();
  }).catch(err => showToast('添加标签失败: ' + err.message, 'error'));
}

function removeTagFromModal(el, tag) {
  const fileIdMatch = el.closest('.modal-overlay')?.querySelector('[onclick*="addTagFromModal"]')?.getAttribute('onclick')?.match(/addTagFromModal\('([^']+)'\)/);
  if (!fileIdMatch) return;
  const fileId = decodeURIComponent(fileIdMatch[1]);
  apiFetch(`${API_BASE}/api/manage/tags/${encodeURIComponent(fileId)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
    body: JSON.stringify({ action: 'remove', tags: [tag] })
  }).then(() => {
    showTagModal(fileIdMatch[1], document.querySelector('#modalBody div[style*="font-weight:600"]')?.textContent || '');
    loadFiles();
  }).catch(err => showToast('移除标签失败: ' + err.message, 'error'));
}

function showTagSuggestions(value) {
  const container = document.getElementById('tagSuggestions');
  if (!container) return;
  if (!value.trim()) { container.classList.remove('show'); return; }
  const suggestions = allKnownTags.filter(t => t.includes(value.toLowerCase())).slice(0, 8);
  if (!suggestions.length) { container.classList.remove('show'); return; }
  container.innerHTML = suggestions.map(t => `<div class="tag-suggestion-item" onclick="document.getElementById('tagInput').value='${t}';addTagFromModal(document.querySelector('#modalBody [onclick*=addTagFromModal]')?.getAttribute('onclick')?.match(/addTagFromModal\\('([^']+)'\\)/)?.[1])">${escapeHtml(t)}</div>`).join('');
  container.classList.add('show');
}

// 通用文件渲染到指定容器
function renderFilesToContainer(data, container) {
  const files = data.files || [];
  if (files.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>暂无文件</div></div>';
    return;
  }
  let html = '<div class="file-grid">';
  files.forEach(file => {
    const meta = file.metadata || file;
    const name = meta.FileName || file.name?.split('/').pop() || '未知';
    const size = meta.FileSizeBytes ? formatSize(parseInt(meta.FileSizeBytes)) : (meta.FileSize ? meta.FileSize + ' MB' : '');
    const time = formatDate(meta.TimeStamp);
    const fileId = encodeURIComponent(file.name || file.id);
    const fileType = meta.FileType || '';
    const isImage = fileType.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(name);
    const isVideo = fileType.startsWith('video/') || /\.(mp4|webm|ogg|mov|avi|mkv|flv|wmv)$/i.test(name);
    const thumbUrl = isImage ? `${API_BASE}/file/${fileId}?from=admin` : '';
    const iconHtml = isImage
      ? `<div class="file-thumb" style="background-image:url('${thumbUrl}')"></div>`
      : `<div class="file-icon">${getFileIcon(name, fileType)}</div>`;
    const clickAction = isImage ? `previewFile('${fileId}', '${escapeHtml(name)}', 'image')` : (isVideo ? `previewFile('${fileId}', '${escapeHtml(name)}', 'video')` : `showFileMenu('${fileId}', '${escapeHtml(name)}')`);
    const isStarred = meta.Starred || meta.starred;
    html += `<div class="file-card" onclick="${clickAction}" oncontextmenu="event.preventDefault();showFileContextMenu(event,'${fileId}','${escapeHtml(name)}')">
      <span class="star-btn ${isStarred ? 'starred' : ''}" onclick="event.stopPropagation();toggleStar('${fileId}')" title="收藏">★</span>
      <div class="file-actions">
        <button class="btn-icon" onclick="event.stopPropagation();downloadFile('${fileId}')" title="下载">⬇️</button>
        <button class="btn-icon" onclick="event.stopPropagation();showShareModal('${fileId}', '${escapeHtml(name)}')" title="分享">🔗</button>
        <button class="btn-icon" onclick="event.stopPropagation();showFileContextMenu(event,'${fileId}','${escapeHtml(name)}')" title="更多">⋯</button>
      </div>
      ${iconHtml}
      <div class="file-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
      <div class="file-meta"><span>${size}</span><span class="file-meta-time">${time}</span></div>
      <div class="file-card-tags">${renderFileTags(meta.Tags || [])}</div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

    }
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>加载失败: ${err.message}</div></div>`;
  }
}

async function loadManageUsers() {
  const container = document.getElementById('manageContent');
  container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">加载中...</div>';
  try {
    const data = await apiFetch(`${API_BASE}/api/manage/users`, { headers: getAuthHeaders() });
    const users = data.users || [];
    let html = `<div class="manage-section"><div class="manage-section-title" style="justify-content:space-between"><span>👥 子账号列表 (${users.length})</span><button class="btn btn-primary btn-sm" onclick="showCreateUserModal()">+ 新建子账号</button></div>`;
    if (!users.length) {
      html += '<div style="text-align:center;padding:2rem;color:var(--muted)">暂无子账号</div>';
    } else {
      users.forEach(u => {
        const statusColor = u.enabled ? 'var(--success)' : 'var(--muted)';
        const statusText = u.enabled ? '启用' : '禁用';
        html += `<div class="manage-card" style="margin-bottom:0.5rem">
          <div class="manage-card-header">
            <div><span class="manage-card-title">${escapeHtml(u.displayName || u.username)}</span><span style="color:var(--muted);font-size:0.78rem;margin-left:0.5rem">@${escapeHtml(u.username)}</span></div>
            <div class="manage-card-actions">
              <button class="btn btn-outline btn-sm" onclick="showEditUserModal('${escapeHtml(u.username)}')">✏️ 编辑</button>
              <button class="btn btn-outline btn-sm" onclick="toggleUserStatus('${escapeHtml(u.username)}')">${u.enabled ? '⏸️ 禁用' : '▶️ 启用'}</button>
              <button class="btn btn-danger btn-sm" onclick="deleteUser('${escapeHtml(u.username)}')">🗑️</button>
            </div>
          </div>
          <div class="user-permission-tags">${(u.permissions || []).map(p => `<span class="perm-tag ${p}">${p === 'read' ? '只读' : p === 'upload' ? '上传' : p === 'delete' ? '删除' : p}</span>`).join('')}</div>
          <div class="manage-card-meta">状态: <span style="color:${statusColor};font-weight:600">${statusText}</span>${u.quota ? ` · 配额: ${u.quota}MB` : ''}${u.allowedDirs?.length ? ` · 目录: ${u.allowedDirs.map(d => escapeHtml(d || '/')).join(', ')}` : ''}</div>
        </div>`;
      });
    }
    html += '</div>';
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>加载失败: ${err.message}</div></div>`;
  }
}

function showCreateUserModal() {
  showModal('新建子账号', `
    <div class="modal-field"><label class="modal-label">用户名 *</label><input class="modal-input" id="newUsername" placeholder="小写字母、数字"></div>
    <div class="modal-field"><label class="modal-label">密码 *</label><input class="modal-input" id="newPassword" type="password" placeholder="至少8位，建议包含字母、数字、符号" oninput="updatePasswordStrength('newPassword')"><div id="passwordStrengthIndicator"></div></div>
    <div class="modal-field"><label class="modal-label">显示名称</label><input class="modal-input" id="newDisplayName" placeholder="可选"></div>
    <div class="modal-field"><label class="modal-label">存储配额 (MB, 0=无限)</label><input class="modal-input" id="newQuota" type="number" value="0"></div>
    <div class="modal-field">
      <label class="modal-label">权限</label>
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:0.3rem">
        <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;cursor:pointer"><input type="checkbox" id="permRead" checked> 只读</label>
        <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;cursor:pointer"><input type="checkbox" id="permUpload" checked> 上传</label>
        <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;cursor:pointer"><input type="checkbox" id="permDelete"> 删除</label>
      </div>
    </div>
    <div class="modal-field"><label class="modal-label">允许访问的目录 (每行一个, 留空=全部)</label><textarea class="modal-input" id="newDirs" rows="3" placeholder="docs&#10;photos"></textarea></div>
  `, [
    { text: '取消', class: 'btn-outline', onclick: closeModal },
    { text: '创建', class: 'btn-primary', onclick: doCreateUser }
  ]);
}

async function doCreateUser() {
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const displayName = document.getElementById('newDisplayName').value.trim();
  const quota = parseInt(document.getElementById('newQuota').value) || 0;
  const permissions = [];
  if (document.getElementById('permRead').checked) permissions.push('read');
  if (document.getElementById('permUpload').checked) permissions.push('upload');
  if (document.getElementById('permDelete').checked) permissions.push('delete');
  const dirsRaw = document.getElementById('newDirs').value.trim();
  const allowedDirs = dirsRaw ? dirsRaw.split('\n').map(d => d.trim()).filter(Boolean) : [];
  if (!username || !password) { showToast('用户名和密码必填', 'warning'); return; }
  const strength = checkPasswordStrength(password);
  if (!strength.valid) {
    showToast(`密码强度不足：${strength.suggestions[0] || '请使用更复杂的密码'}`, 'warning');
    return;
  }
  try {
    await apiFetch(`${API_BASE}/api/manage/users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
      body: JSON.stringify({ username, password, displayName, quota, permissions, allowedDirs, enabled: true })
    });
    showToast('子账号创建成功', 'success');
    closeModal();
    loadManageUsers();
  } catch (err) { showToast('创建失败: ' + err.message, 'error'); }
}

function showEditUserModal(username) {
  apiFetch(`${API_BASE}/api/manage/users/${encodeURIComponent(username)}`, { headers: getAuthHeaders() })
    .then(user => {
      showModal('编辑子账号', `
        <div class="modal-field"><label class="modal-label">用户名</label><input class="modal-input" value="${escapeHtml(user.username)}" disabled style="opacity:0.6"></div>
        <div class="modal-field"><label class="modal-label">显示名称</label><input class="modal-input" id="editDisplayName" value="${escapeHtml(user.displayName || '')}"></div>
        <div class="modal-field"><label class="modal-label">新密码 (留空不修改)</label><input class="modal-input" id="editPassword" type="password" placeholder="留空不修改" oninput="updatePasswordStrength('editPassword')"><div id="passwordStrengthIndicator"></div></div>
        <div class="modal-field"><label class="modal-label">存储配额 (MB, 0=无限)</label><input class="modal-input" id="editQuota" type="number" value="${user.quota || 0}"></div>
        <div class="modal-field">
          <label class="modal-label">权限</label>
          <div style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:0.3rem">
            <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;cursor:pointer"><input type="checkbox" id="editPermRead" ${(user.permissions||[]).includes('read')?'checked':''}> 只读</label>
            <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;cursor:pointer"><input type="checkbox" id="editPermUpload" ${(user.permissions||[]).includes('upload')?'checked':''}> 上传</label>
            <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;cursor:pointer"><input type="checkbox" id="editPermDelete" ${(user.permissions||[]).includes('delete')?'checked':''}> 删除</label>
          </div>
        </div>
        <div class="modal-field"><label class="modal-label">允许访问的目录 (每行一个)</label><textarea class="modal-input" id="editDirs" rows="3">${(user.allowedDirs||[]).join('\n')}</textarea></div>
      `, [
        { text: '取消', class: 'btn-outline', onclick: closeModal },
        { text: '保存', class: 'btn-primary', onclick: () => doEditUser(username) }
      ]);
    })
    .catch(err => showToast('获取用户信息失败: ' + err.message, 'error'));
}

async function doEditUser(username) {
  const displayName = document.getElementById('editDisplayName').value.trim();
  const password = document.getElementById('editPassword').value;
  const quota = parseInt(document.getElementById('editQuota').value) || 0;
  const permissions = [];
  if (document.getElementById('editPermRead').checked) permissions.push('read');
  if (document.getElementById('editPermUpload').checked) permissions.push('upload');
  if (document.getElementById('editPermDelete').checked) permissions.push('delete');
  const dirsRaw = document.getElementById('editDirs').value.trim();
  const allowedDirs = dirsRaw ? dirsRaw.split('\n').map(d => d.trim()).filter(Boolean) : [];
  const body = { displayName, quota, permissions, allowedDirs };
  if (password) {
    const strength = checkPasswordStrength(password);
    if (!strength.valid) {
      showToast(`密码强度不足：${strength.suggestions[0] || '请使用更复杂的密码'}`, 'warning');
      return;
    }
    body.password = password;
  }
  try {
    await apiFetch(`${API_BASE}/api/manage/users/${encodeURIComponent(username)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
      body: JSON.stringify(body)
    });
    showToast('更新成功', 'success');
    closeModal();
    loadManageUsers();
  } catch (err) { showToast('更新失败: ' + err.message, 'error'); }
}

async function toggleUserStatus(username) {
  try {
    await apiFetch(`${API_BASE}/api/manage/users/${encodeURIComponent(username)}?action=toggle`, {
      method: 'POST',
      headers: getAuthHeaders()
    });
    showToast('状态已切换', 'success');
    loadManageUsers();
  } catch (err) { showToast('操作失败: ' + err.message, 'error'); }
}

async function deleteUser(username) {
  if (!confirm(`确定删除子账号 "${username}" 吗？此操作不可恢复！`)) return;
  try {
    await apiFetch(`${API_BASE}/api/manage/users/${encodeURIComponent(username)}`, {
      method: 'DELETE',
      headers: getAuthHeaders()
    });
    showToast('已删除', 'success');
    loadManageUsers();
  } catch (err) { showToast('删除失败: ' + err.message, 'error'); }
}

// ============================
// 操作日志
// ============================
let logFilter = '';
async function loadManageLogs() {
  const container = document.getElementById('manageContent');
  container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">加载中...</div>';
  try {
    let url = `${API_BASE}/api/manage/logs?limit=100`;
    if (logFilter) url += `&action=${encodeURIComponent(logFilter)}`;
    const data = await apiFetch(url, { headers: getAuthHeaders() });
    const logs = data.logs || [];
    const actionIcons = { upload:'⬆️', delete:'🗑️', download:'⬇️', share:'🔗', login:'🔑', rename:'✏️', move:'📂', copy:'📋', config_change:'⚙️', user_create:'👤', user_delete:'👤' };
    let html = `<div class="manage-section">
      <div class="manage-section-title" style="justify-content:space-between"><span>📋 操作日志 (${data.total || logs.length})</span>
        <button class="btn btn-danger btn-sm" onclick="clearAllLogs()">清空日志</button>
      </div>
      <div class="log-action-filter">
        <button class="log-filter-btn ${!logFilter?'active':''}" onclick="logFilter='';loadManageLogs()">全部</button>
        <button class="log-filter-btn ${logFilter==='upload'?'active':''}" onclick="logFilter='upload';loadManageLogs()">上传</button>
        <button class="log-filter-btn ${logFilter==='delete'?'active':''}" onclick="logFilter='delete';loadManageLogs()">删除</button>
        <button class="log-filter-btn ${logFilter==='download'?'active':''}" onclick="logFilter='download';loadManageLogs()">下载</button>
        <button class="log-filter-btn ${logFilter==='share'?'active':''}" onclick="logFilter='share';loadManageLogs()">分享</button>
        <button class="log-filter-btn ${logFilter==='login'?'active':''}" onclick="logFilter='login';loadManageLogs()">登录</button>
      </div>`;
    if (!logs.length) {
      html += '<div style="text-align:center;padding:2rem;color:var(--muted)">暂无操作日志</div>';
    } else {
      html += '<div class="manage-card">';
      logs.forEach(log => {
        html += `<div class="log-item"><div class="log-icon">${actionIcons[log.action] || '📝'}</div><div class="log-content"><div class="log-text">${escapeHtml(log.details || log.action)}</div><div class="log-detail">${escapeHtml(log.username || '管理员')}${log.fileName ? ' · ' + escapeHtml(log.fileName) : ''}${log.ip ? ' · ' + escapeHtml(log.ip) : ''}</div></div><div class="log-time">${formatDate(log.timestamp)}</div></div>`;
      });
      html += '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>加载失败: ${err.message}</div></div>`;
  }
}

async function clearAllLogs() {
  if (!confirm('确定清空所有操作日志？此操作不可恢复！')) return;
  try {
    await apiFetch(`${API_BASE}/api/manage/logs?action=clear`, { method: 'DELETE', headers: getAuthHeaders() });
    showToast('日志已清空', 'success');
    loadManageLogs();
  } catch (err) { showToast('清空失败: ' + err.message, 'error'); }
}

(async function init() {
  const valid = await checkSession();
  if (valid) {
    document.getElementById('loginOverlay').style.display = 'none';
    loadFiles();
    loadStorageStats();
    updateBadges();
    loadTagsNav();
  } else {
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('loginAuthCode').focus();
  }
})();
