<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人网盘</title>
<style>
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #fafafa;
  --ink: #1d1d1f;
  --ink-2: #424245;
  --muted: #86868b;
  --rule: #e5e5e7;
  --rule-2: #d2d2d7;
  --accent: #6366f1;
  --accent-light: #eef2ff;
  --accent-dark: #4f46e5;
  --accent-soft: rgba(99,102,241,0.08);
  --accent2: #8b5cf6;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --danger-light: #fef2f2;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.10);
  --gradient-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
  --gradient-accent: linear-gradient(135deg, #6366f1, #8b5cf6);
  --gradient-bg: linear-gradient(180deg, #f5f5f7 0%, #eeeef0 100%);
  --gradient-sidebar: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--gradient-bg);
  background-attachment: fixed;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}

/* ===== Layout ===== */
.app { display: flex; min-height: 100vh; animation: appFadeIn 0.35s ease; }
@keyframes appFadeIn { from { opacity: 0; } to { opacity: 1; } }
.sidebar {
  width: 240px;
  background: var(--gradient-sidebar);
  padding: 1.25rem 0.875rem;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid var(--rule);
  z-index: 20;
}
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.content { flex: 1; padding: 1.5rem 1.75rem; overflow-y: auto; }

/* ===== Sidebar ===== */
.logo {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--ink);
  padding: 0.25rem 0.625rem 1.125rem;
  border-bottom: 1px solid var(--rule);
}
.logo-icon {
  font-size: 1.5rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px; height: 38px;
  background: var(--gradient-accent);
  border-radius: 11px;
  box-shadow: 0 3px 12px rgba(99,102,241,0.3);
}
.logo span:not(.logo-icon) { letter-spacing: -0.02em; }
.nav-section { margin-bottom: 1.25rem; }
.nav-title {
  font-size: 0.68rem;
  text-transform: uppercase;
  color: var(--muted);
  letter-spacing: 0.06em;
  margin-bottom: 0.375rem;
  padding-left: 0.75rem;
  font-weight: 600;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.6rem 0.75rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--ink-2);
  transition: all 0.18s ease;
  font-weight: 500;
  margin-bottom: 2px;
  position: relative;
  font-size: 0.875rem;
}
.nav-item:hover { background: var(--accent-soft); color: var(--accent); }
.nav-item.active {
  background: var(--gradient-accent);
  color: #fff;
  box-shadow: 0 4px 14px rgba(99,102,241,0.35);
  font-weight: 600;
}
.nav-icon { font-size: 1.1rem; width: 22px; text-align: center; }

.storage-info {
  margin-top: auto;
  padding: 0.875rem;
  background: var(--surface-2);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
}
.storage-info > div:first-child { font-size: 0.78rem; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 0.4rem; }
.storage-bar { height: 6px; background: var(--rule); border-radius: 3px; margin: 0.55rem 0; overflow: hidden; }
.storage-fill { height: 100%; background: var(--gradient-accent); border-radius: 3px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
.storage-text { font-size: 0.72rem; color: var(--muted); }

.sidebar-user {
  margin-top: 0.625rem;
  display: flex; align-items: center; gap: 0.55rem;
  padding: 0.55rem 0.7rem;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: all 0.18s ease;
  color: var(--ink-2);
}
.sidebar-user:hover { background: var(--danger-light); border-color: rgba(239,68,68,0.2); color: var(--danger); }
.sidebar-user-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--gradient-accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; flex-shrink: 0;
}
.sidebar-user-info { flex: 1; min-width: 0; }
.sidebar-user-name { font-size: 0.78rem; font-weight: 600; color: var(--ink); }
.sidebar-user-sub { font-size: 0.68rem; color: var(--muted); }
.sidebar-user-icon { font-size: 0.9rem; color: var(--muted); }

/* ===== Topbar ===== */
.topbar {
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--rule);
  padding: 0.75rem 1.75rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  position: sticky;
  top: 0;
  z-index: 15;
}
.breadcrumb { display: flex; align-items: center; gap: 0.2rem; flex: 1; min-width: 0; }
.crumb {
  cursor: pointer;
  color: var(--muted);
  padding: 4px 8px;
  border-radius: var(--radius-xs);
  white-space: nowrap;
  font-size: 0.84rem;
  transition: all 0.15s;
}
.crumb:hover { background: var(--accent-soft); color: var(--accent); }
.crumb.current { color: var(--ink); font-weight: 600; }
.crumb-sep { color: var(--rule-2); margin: 0 1px; }

/* ===== Search ===== */
.search-box {
  position: relative;
  width: 300px;
  max-width: 30vw;
}
.search-input {
  width: 100%;
  padding: 0.5rem 0.8rem 0.5rem 2.3rem;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  outline: none;
  transition: all 0.2s;
  background: var(--surface-2);
}
.search-input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.85rem; }

/* ===== Buttons ===== */
.btn {
  padding: 0.5rem 1rem;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--gradient-accent); color: #fff; box-shadow: 0 3px 10px rgba(99,102,241,0.3); }
.btn-primary:hover { box-shadow: 0 5px 16px rgba(99,102,241,0.4); filter: brightness(1.05); }
.btn-outline { background: var(--surface); border: 1px solid var(--rule-2); color: var(--ink-2); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.btn-danger { background: var(--danger); color: #fff; box-shadow: 0 3px 10px rgba(239,68,68,0.25); }
.btn-danger:hover { background: #dc2626; box-shadow: 0 5px 16px rgba(239,68,68,0.35); }
.btn-sm { padding: 0.375rem 0.7rem; font-size: 0.78rem; border-radius: var(--radius-xs); }
.btn-icon {
  width: 32px; height: 32px; padding: 0;
  justify-content: center;
  border-radius: var(--radius-xs);
  border: 1px solid var(--rule);
  background: var(--surface);
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.18s ease;
  display: inline-flex; align-items: center;
  color: var(--ink-2);
}
.btn-icon:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

.btn-refresh {
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-sm);
  width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; transition: all 0.25s ease; color: var(--muted);
  flex-shrink: 0;
}
.btn-refresh:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); transform: rotate(180deg); }

/* ===== Toolbar ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.toolbar-spacer { flex: 1; }
.sort-select {
  padding: 0.45rem 0.75rem;
  border: 1px solid var(--rule);
  border-radius: var(--radius-xs);
  font-size: 0.82rem;
  background: var(--surface);
  cursor: pointer;
  transition: all 0.15s;
  color: var(--ink-2);
}
.sort-select:hover { border-color: var(--accent); }
.sort-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ===== File Grid ===== */
.file-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 0.875rem;
}
.file-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 0.875rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  box-shadow: var(--shadow);
}
.file-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.file-card.selected { border-color: var(--accent); background: var(--accent-light); box-shadow: 0 0 0 2px var(--accent); }
.file-icon { font-size: 2.8rem; margin-bottom: 0.4rem; line-height: 1; }
.file-name {
  font-size: 0.8rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 0.2rem;
  color: var(--ink);
}
.file-meta { font-size: 0.7rem; color: var(--muted); }
.file-actions {
  position: absolute;
  top: 6px; right: 6px;
  display: none;
  gap: 3px;
  background: rgba(255,255,255,0.95);
  padding: 3px;
  border-radius: var(--radius-xs);
  box-shadow: var(--shadow-md);
}
.file-card:hover .file-actions { display: flex; }

/* ===== Thumbnail ===== */
.file-thumb {
  width: 100%;
  height: 130px;
  background-size: cover;
  background-position: center;
  background-color: var(--surface-2);
  border-radius: var(--radius-sm);
  margin-bottom: 0.5rem;
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: all 0.2s;
}
.file-card:hover .file-thumb { border-color: var(--accent); }

/* ===== Image Preview Overlay ===== */
.preview-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(8px);
  z-index: 3000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.25s ease;
}
.preview-content {
  position: relative;
  max-width: 90vw;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
}
.preview-img {
  max-width: 90vw;
  max-height: 75vh;
  object-fit: contain;
  border-radius: var(--radius);
  display: none;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.preview-content.loaded .preview-img { display: block; animation: zoomIn 0.3s ease; }
.preview-content.loaded .preview-loading { display: none; }
@keyframes zoomIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.preview-loading {
  color: #fff;
  font-size: 1rem;
  padding: 2rem;
}
.preview-error {
  color: var(--danger);
  font-size: 1rem;
  padding: 2rem;
}
.preview-info {
  color: #fff;
  font-size: 0.85rem;
  text-align: center;
  word-break: break-all;
  max-width: 80vw;
}
.preview-toolbar {
  display: flex;
  gap: 0.5rem;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===== File List (table) ===== */
.file-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.file-table th {
  text-align: left;
  padding: 0.7rem 1rem;
  font-size: 0.7rem;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--rule);
  font-weight: 600;
  letter-spacing: 0.03em;
  background: var(--surface-2);
}
.file-table td {
  padding: 0.65rem 1rem;
  border-bottom: 1px solid var(--rule);
  font-size: 0.84rem;
}
.file-table tbody tr { cursor: pointer; transition: background 0.12s; }
.file-table tbody tr:hover { background: var(--accent-light); }
.file-table .col-name { display: flex; align-items: center; gap: 0.55rem; font-weight: 500; }
.file-table .col-icon { font-size: 1.3rem; }
.file-table .col-actions { text-align: right; white-space: nowrap; }

/* ===== Upload Zone ===== */
.upload-zone {
  border: 2px dashed var(--rule-2);
  border-radius: var(--radius);
  padding: 2.5rem 2rem;
  text-align: center;
  transition: all 0.25s;
  margin-bottom: 1rem;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.upload-zone:hover { border-color: var(--accent); background: var(--accent-light); }
.upload-zone.dragover { border-color: var(--accent); background: var(--accent-light); transform: scale(1.005); box-shadow: 0 0 0 4px var(--accent-soft); }
.upload-zone-icon { font-size: 3.2rem; margin-bottom: 0.6rem; animation: bounce 2s infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.upload-zone-text { color: var(--muted); margin-bottom: 0.75rem; font-size: 0.9rem; }

/* ===== Upload Progress ===== */
.upload-list { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
.upload-item {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 0.75rem 0.875rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  box-shadow: var(--shadow);
  transition: all 0.2s;
}
.upload-item:hover { box-shadow: var(--shadow-md); }
.upload-item-info { flex: 1; min-width: 0; }
.upload-item-name { font-size: 0.82rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upload-item-status { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.progress-bar { height: 5px; background: var(--rule); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gradient-accent); border-radius: 3px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
.progress-fill.success { background: linear-gradient(90deg, #22c55e, #16a34a); }
.progress-fill.error { background: linear-gradient(90deg, #ef4444, #dc2626); }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1.5rem;
  width: 90%;
  max-width: 460px;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.25s cubic-bezier(0.4,0,0.2,1);
}
@keyframes modalIn { from { transform: translateY(16px) scale(0.96); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
.modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; color: var(--ink); }
.modal-body { margin-bottom: 1.25rem; }
.modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; }
.modal-input {
  width: 100%;
  padding: 0.6rem 0.85rem;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  outline: none;
  transition: all 0.2s;
  background: var(--surface-2);
}
.modal-input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.modal-label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--ink); }
.modal-field { margin-bottom: 0.875rem; }

/* ===== Share Link Display ===== */
.share-link-box {
  display: flex;
  gap: 0.5rem;
  align-items: center;
  background: var(--accent-light);
  border: 1px solid rgba(99,102,241,0.15);
  padding: 0.6rem 0.8rem;
  border-radius: var(--radius-sm);
  margin-top: 0.5rem;
}
.share-link-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 0.82rem;
  color: var(--accent);
  outline: none;
  font-family: 'SF Mono', Monaco, monospace;
}

/* ===== Toast ===== */
.toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 2000; display: flex; flex-direction: column; gap: 0.5rem; }
.toast {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 0.75rem 1.1rem;
  box-shadow: var(--shadow-lg);
  font-size: 0.84rem;
  font-weight: 500;
  border-left: 3px solid var(--accent);
  animation: slideIn 0.3s cubic-bezier(0.4,0,0.2,1);
  min-width: 200px;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ===== Empty State ===== */
.empty-state { text-align: center; padding: 3.5rem 2rem; color: var(--muted); }
.empty-state-icon { font-size: 3.5rem; margin-bottom: 0.6rem; opacity: 0.6; animation: floatUp 3s ease-in-out infinite; }
@keyframes floatUp { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* ===== Batch Operations ===== */
.batch-toolbar {
  display: none;
  align-items: center;
  gap: 0.6rem;
  margin-bottom: 1rem;
  padding: 0.6rem 0.875rem;
  background: var(--accent-light);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: var(--radius-sm);
  flex-wrap: wrap;
  position: sticky;
  top: 64px;
  z-index: 10;
  box-shadow: var(--shadow);
}
.batch-toolbar.show { display: flex; animation: slideDown 0.22s ease; }
@keyframes slideDown { from { transform: translateY(-6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.batch-count { font-size: 0.84rem; font-weight: 700; color: var(--accent); }
.file-checkbox {
  width: 17px; height: 17px;
  cursor: pointer;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.file-card .file-checkbox {
  position: absolute;
  top: 8px; left: 8px;
  z-index: 5;
  width: 18px; height: 18px;
}
.batch-select-all-label {
  display: flex; align-items: center; gap: 0.4rem;
  font-size: 0.82rem; cursor: pointer; font-weight: 500;
}

/* ===== Recycle Bin ===== */
.trash-item {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  padding: 0.75rem 0.875rem;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  box-shadow: var(--shadow);
  transition: all 0.2s;
}
.trash-item:hover { box-shadow: var(--shadow-md); border-color: var(--warning); }
.trash-item-info { flex: 1; min-width: 0; }
.trash-item-name { font-size: 0.84rem; font-weight: 600; }
.trash-item-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

/* ===== Context Menu ===== */
.context-menu {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  z-index: 5000;
  min-width: 180px;
  overflow: hidden;
  display: none;
  padding: 4px;
  animation: menuIn 0.12s ease;
}
@keyframes menuIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.context-menu.show { display: block; }
.context-menu-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.75rem;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 500;
  transition: all 0.12s;
  border-radius: var(--radius-xs);
  color: var(--ink-2);
}
.context-menu-item:hover { background: var(--accent-soft); color: var(--accent); }
.context-menu-item.danger { color: var(--danger); }
.context-menu-item.danger:hover { background: var(--danger-light); }
.context-menu-divider { height: 1px; background: var(--rule); margin: 4px 6px; }

/* ===== Directory Tree Modal ===== */
.dir-tree-container {
  max-height: 380px;
  overflow-y: auto;
  border: 1px solid var(--rule);
  border-radius: var(--radius-sm);

}
.dir-tree-node {

}
.dir-tree-node:hover { background: var(--accent-soft); color: var(--accent); }

/* ===== Login ===== */
.login-overlay {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, #1e1b4b 0%, #312e81 30%, #4c1d95 70%, #5b21b6 100%);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
  overflow: hidden;
}
.login-overlay::before {
  content: ''; position: absolute; inset: -50%;
  background: radial-gradient(circle at 30% 20%, rgba(139,92,246,0.3), transparent 40%), radial-gradient(circle at 70% 80%, rgba(99,102,241,0.3), transparent 40%);
  animation: bgShift 12s ease-in-out infinite alternate;
}
@keyframes bgShift { from { transform: translate(0,0); } to { transform: translate(40px, -30px); } }
.login-card {
  position: relative; z-index: 1;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 2.5rem;
  width: 370px; max-width: 90vw;
  box-shadow: 0 30px 70px rgba(0,0,0,0.4);

  animation: cardIn 0.5s cubic-bezier(0.4,0,0.2,1);
}
@keyframes cardIn { from { transform: translateY(24px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
.login-logo {
  font-size: 3rem;
  margin-bottom: 0.4rem;
  display: inline-flex; align-items: center; justify-content: center;
  width: 68px; height: 68px;
  background: var(--gradient-accent);
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(99,102,241,0.5);
}
.login-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; color: #fff; letter-spacing: -0.02em; }
.login-subtitle { font-size: 0.85rem; color: rgba(203,213,225,0.8); margin-bottom: 1.5rem; }
.login-input {
  width: 100%; padding: 0.8rem 1rem;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-sm); font-size: 0.92rem; margin-bottom: 0.875rem;
  background: rgba(255,255,255,0.06);
  color: #fff;
  transition: all 0.2s;
}
.login-input::placeholder { color: rgba(203,213,225,0.5); }
.login-input:focus { outline: none; border-color: var(--accent2); background: rgba(255,255,255,0.10); box-shadow: 0 0 0 3px rgba(139,92,246,0.2); }
.login-btn {
  width: 100%; padding: 0.85rem;
  background: var(--gradient-accent); color: white;
  border: none; border-radius: var(--radius-sm); font-size: 0.95rem; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 6px 20px rgba(99,102,241,0.4);
}
.login-btn:hover { box-shadow: 0 10px 28px rgba(99,102,241,0.5); transform: translateY(-1px); }
.login-btn:active { transform: translateY(0); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.login-error { color: #fca5a5; font-size: 0.82rem; margin-top: 0.75rem; min-height: 1.2em; }
.user-badge {
  display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.75rem;

  color: var(--ink-2); font-weight: 600; transition: all 0.18s;
}
.user-badge:hover { background: var(--danger-light); border-color: rgba(239,68,68,0.2); color: var(--danger); }

/* ===== Share Cards ===== */
.share-card {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 1rem 1.125rem;
  margin-bottom: 0.625rem;

/* ===== Mobile Sidebar Toggle ===== */

.mobile-menu-btn {
  display: none;
  width: 36px; height: 36px;
  align-items: center; justify-content: center;

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .mobile-menu-btn { display: flex; }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);

    box-shadow: var(--shadow-lg);
  }
  .sidebar-toggle-check:checked ~ .app .sidebar { transform: translateX(0); }
  .content { padding: 1rem; }
  .topbar { padding: 0.625rem 1rem; }
  .breadcrumb { display: none; }

}

/* ===== Hidden ===== */
.hidden { display: none !important; }
</style>
</head>
<body>
<!-- Login Overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">📁</div>
    <div class="login-title">我的网盘</div>
    <div class="login-subtitle">请输入管理员账号密码以继续</div>
    <input type="text" class="login-input" id="loginUsername" placeholder="管理员用户名" onkeydown="if(event.key==='Enter')document.getElementById('loginPassword').focus()">
    <input type="password" class="login-input" id="loginPassword" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">登录</button>
    <div class="login-error" id="loginError"></div>

<input type="checkbox" id="sidebarToggleCheck" class="sidebar-toggle-check">
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <span class="logo-icon">📁</span>
      <span>我的网盘</span>
    </div>
    <div class="nav-section">
      <div class="nav-title">文件</div>
      <div class="nav-item active" data-view="files">
        <span class="nav-icon">📂</span>全部文件
      </div>
      <div class="nav-item" data-view="shares">
        <span class="nav-icon">🔗</span>分享管理
      </div>
      <div class="nav-item" data-view="trash">
        <span class="nav-icon">🗑️</span>回收站
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-title">上传</div>
      <div class="nav-item" data-view="upload">
        <span class="nav-icon">⬆️</span>上传文件
      </div>
    </div>
    <div class="storage-info">
      <div style="font-size:0.78rem;font-weight:600;">💾 存储空间</div>
      <div class="storage-bar"><div class="storage-fill" id="storageFill" style="width:0%"></div></div>
      <div class="storage-text" id="storageText">计算中...</div>
    </div>
    <div class="sidebar-user" onclick="doLogout()" title="点击退出登录">
      <div class="sidebar-user-avatar">👤</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">管理员</div>
        <div class="sidebar-user-sub">点击退出登录</div>
      </div>
      <span class="sidebar-user-icon">⏻</span>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <label for="sidebarToggleCheck" class="mobile-menu-btn" title="菜单">☰</label>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索文件...">
      </div>
      <button class="btn-refresh" onclick="currentView==='shares'?loadShares():currentView==='trash'?loadTrash():loadFiles()" title="刷新">🔄</button>
      <button class="btn btn-primary" onclick="showUploadView()">
        <span>⬆️</span>上传
      </button>
      <button class="btn btn-outline" onclick="showCreateDirModal()">
        <span>📁</span>新建文件夹
      </button>
      <div class="user-badge" onclick="doLogout()" title="点击退出登录">
        <span>👤</span><span>退出</span>
      </div>
    </div>

    <div class="content" id="content">
      <!-- Files View -->
      <div id="filesView">
        <div class="toolbar">
          <button class="btn btn-outline btn-sm" onclick="goBack()" id="backBtn">← 返回</button>
          <label class="batch-select-all-label">
            <input type="checkbox" class="file-checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)">
            <span>全选</span>
          </label>
          <div class="toolbar-spacer"></div>
          <select class="sort-select" id="sortBy" onchange="loadFiles()">
            <option value="">默认排序</option>
            <option value="name">按名称</option>
            <option value="size">按大小</option>
            <option value="time">按时间</option>
          </select>
          <select class="sort-select" id="sortOrder" onchange="loadFiles()">
            <option value="desc">降序</option>
            <option value="asc">升序</option>
          </select>
          <button class="btn-icon" onclick="toggleView()" id="viewToggle" title="切换视图">⊞</button>
        </div>
        <!-- Batch Toolbar -->
        <div class="batch-toolbar" id="batchToolbar">
          <span class="batch-count" id="batchCount">已选 0 项</span>
          <button class="btn btn-outline btn-sm" onclick="batchMove()">📂 移动</button>
          <button class="btn btn-outline btn-sm" onclick="batchCopy()">📋 复制</button>
          <button class="btn btn-outline btn-sm" onclick="batchShare()">🔗 分享</button>
          <button class="btn btn-danger btn-sm" onclick="batchDelete()">🗑️ 删除</button>
          <div class="toolbar-spacer"></div>
          <button class="btn btn-outline btn-sm" onclick="clearBatchSelection()">取消选择</button>

      <!-- Upload View -->

        <div class="upload-zone" id="uploadZone">
          <div class="upload-zone-icon">📤</div>
          <div class="upload-zone-text">拖拽文件到此处,或</div>
          <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">选择文件</button>
          <input type="file" id="fileInput" multiple style="display:none" onchange="handleFileSelect(event)">
          <div style="margin-top:0.6rem;font-size:0.78rem;color:var(--muted)">
            支持大文件分片上传(每片16MB),断点续传,1小时内传完即可
          </div>
        </div>
        <div class="upload-list" id="uploadList"></div>
      </div>

      <!-- Shares View -->
      <div id="sharesView" class="hidden">
        <div class="toolbar">
          <h3 style="font-weight:600;">分享管理</h3>
          <div class="toolbar-spacer"></div>
        </div>
        <div id="sharesContainer"></div>
      </div>

      <!-- Trash View -->
      <div id="trashView" class="hidden">
        <div class="toolbar">
          <h3 style="font-weight:600;">回收站</h3>
          <div class="toolbar-spacer"></div>
          <button class="btn btn-danger btn-sm" onclick="emptyTrash()" id="emptyTrashBtn">清空回收站</button>
        </div>
        <div id="trashContainer"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Context Menu -->
<div class="context-menu" id="contextMenu"></div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>

// ============================
// 全局状态
// ============================
const API_BASE = '';
const CHUNK_SIZE = 16 * 1024 * 1024; // 16MB
let currentDir = '';
let currentView = 'files';
let viewMode = 'grid'; // grid | list
let shareContext = null; // 用于分享弹窗的上下文
let isLoggedIn = false; // 登录状态
let selectedFiles = new Set(); // 批量选择的文件ID集合
let moveContext = null; // 移动/复制操作的上下文
let lastRenderedFiles = []; // 最近渲染的文件列表（供批量操作使用）
let lastRenderedDirs = []; // 最近渲染的目录列表

// ============================
// 工具函数
// ============================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function formatSize(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function formatDate(timestamp) {
  if (!timestamp) return '';
  const d = new Date(parseInt(timestamp));
  return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function getFileIcon(fileName, fileType, isDir) {
  if (isDir) return '📁';
  const ext = (fileName || '').split('.').pop().toLowerCase();
  const typeMap = {
    jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️', bmp: '🖼️',
    mp4: '🎬', avi: '🎬', mov: '🎬', mkv: '🎬', webm: '🎬',
    mp3: '🎵', wav: '🎵', flac: '🎵', ogg: '🎵',
    pdf: '📄', doc: '📄', docx: '📄', txt: '📄', md: '📄',
    zip: '📦', rar: '📦', '7z': '📦', tar: '📦', gz: '📦',
    xlsx: '📊', xls: '📊', csv: '📊', ppt: '📊', pptx: '📊',
    js: '💻', ts: '💻', json: '💻', html: '💻', css: '💻', py: '💻',
    default: '📄'
  };
  return typeMap[ext] || '📄';
}

async function apiFetch(url, options = {}) {
  // 确保 Cookie 自动携带,用于会话认证
  options.credentials = 'include';
  const resp = await fetch(url, options);
  const text = await resp.text();
  let data;
  try { data = JSON.parse(text); } catch { data = text; }
  if (!resp.ok) {
    throw new Error(data?.error || data?.message || `HTTP ${resp.status}`);
  }
  return data;
}

// ============================
// 认证 - 会话 Cookie 为主,API Token 为辅
// ============================
function getAuthHeaders() {
  // 会话 Cookie 会自动携带,无需手动添加
  // 仅当本地存有 API Token 时才使用 Bearer 认证
  const token = localStorage.getItem('imgbed_token');
  if (token) {
    return { 'Authorization': `Bearer ${token}` };
  }
  return {};
}

// 检查登录会话
async function checkSession() {
  try {
    const resp = await fetch(`${API_BASE}/api/auth/sessionCheck`);
    const data = await resp.json();
    if (data.valid) {
      isLoggedIn = true;
      return true;
    }
    // 未配置认证时直接放行
    if (!data.adminRequired && !data.userRequired) {
      isLoggedIn = true;
      return true;
    }
    isLoggedIn = false;
    return false;
  } catch {
    // 接口异常时假设未认证,显示登录
    isLoggedIn = false;
    return false;
  }
}

// 登录
async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  if (!username || !password) { errEl.textContent = '请输入用户名和密码'; return; }
  
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '登录中...';
  
  try {
    const resp = await fetch(`${API_BASE}/api/auth/adminLogin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      credentials: 'include',
    });
    if (resp.ok) {
      isLoggedIn = true;
      document.getElementById('loginOverlay').style.display = 'none';
      loadFiles();
      loadStorageStats();
      showToast('登录成功', 'success');
    } else if (resp.status === 401) {
      errEl.textContent = '账号或密码错误,请重试';
    } else {
      errEl.textContent = `登录失败 (HTTP ${resp.status})`;
    }
  } catch (err) {
    errEl.textContent = '网络错误: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
}

// 登出
async function doLogout() {
  try {
    await fetch(`${API_BASE}/api/auth/logout`, { method: 'POST', credentials: 'include' });
  } catch {}
  localStorage.removeItem('imgbed_token');
  isLoggedIn = false;
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
  showToast('已退出登录', 'info');
}

// ============================
// 导航
// ============================
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    const view = item.dataset.view;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    showView(view);
  });
});

function showView(view) {
  currentView = view;
  document.getElementById('filesView').classList.add('hidden');
  document.getElementById('uploadView').classList.add('hidden');
  document.getElementById('sharesView').classList.add('hidden');
  document.getElementById('trashView').classList.add('hidden');
  document.getElementById(view + 'View').classList.remove('hidden');
  
  // 清除批量选择状态
  clearBatchSelection();
  
  if (view === 'files') loadFiles();
  if (view === 'shares') loadShares();
  if (view === 'trash') loadTrash();
}

function showUploadView() {
  showView('upload');
}

// ============================
// 面包屑导航
// ============================
function renderBreadcrumb() {
  const container = document.getElementById('breadcrumb');
  container.innerHTML = '';
  
  const rootCrumb = document.createElement('span');
  rootCrumb.className = 'crumb' + (currentDir === '' ? ' current' : '');
  rootCrumb.textContent = '全部文件';
  rootCrumb.onclick = () => { currentDir = ''; loadFiles(); };
  container.appendChild(rootCrumb);
  
  if (currentDir) {
    const parts = currentDir.split('/').filter(p => p);
    let path = '';
    parts.forEach((part, i) => {
      path += (i > 0 ? '/' : '') + part;
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '/';
      container.appendChild(sep);
      
      const crumb = document.createElement('span');
      crumb.className = 'crumb' + (i === parts.length - 1 ? ' current' : '');
      crumb.textContent = part;
      const capturedPath = path + (i < parts.length - 1 ? '/' : '');
      crumb.onclick = () => { currentDir = capturedPath; loadFiles(); };
      container.appendChild(crumb);
    });
  }
}

function goBack() {
  if (!currentDir) return;
  const parts = currentDir.split('/').filter(p => p);
  parts.pop();
  currentDir = parts.join('/') + (parts.length > 0 ? '/' : '');
  loadFiles();
}

// ============================
// 文件列表
// ============================
async function loadFiles() {
  renderBreadcrumb();
  const container = document.getElementById('fileListContainer');
  container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">加载中...</div>';
  
  try {
    const sortBy = document.getElementById('sortBy').value;
    const sortOrder = document.getElementById('sortOrder').value;
    const search = document.getElementById('searchInput').value.trim();
    
    let url = `${API_BASE}/api/manage/list?dir=${encodeURIComponent(currentDir)}&count=500`;
    if (sortBy) url += `&sortBy=${sortBy}&sortOrder=${sortOrder}`;
    if (search) url += `&search=${encodeURIComponent(search)}`;
    
    const data = await apiFetch(url, { headers: getAuthHeaders() });
    renderFiles(data);
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>加载失败: ${err.message}</div><div style="margin-top:0.5rem;font-size:0.8rem">请确保已登录管理后台</div></div>`;
  }
}

function renderFiles(data) {
  const container = document.getElementById('fileListContainer');
  const files = data.files || [];
  const directories = data.directories || [];
  
  lastRenderedFiles = files;
  lastRenderedDirs = directories;
  
  if (files.length === 0 && directories.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>此文件夹为空</div></div>';
    updateBatchToolbar();
    return;
  }
  
  if (viewMode === 'grid') {
    let html = '<div class="file-grid">';
    directories.forEach(dir => {
      const dirName = dir.split('/').filter(p => p).pop();
      const dirEncoded = encodeURIComponent(dir);
      html += `<div class="file-card" onclick="enterDir('${dirEncoded}')" oncontextmenu="event.preventDefault();showDirContextMenu(event,'${dirEncoded}','${escapeHtml(dirName)}')">
        <div class="file-actions">
          <button class="btn-icon" onclick="event.stopPropagation();showDirContextMenu(event,'${dirEncoded}','${escapeHtml(dirName)}')" title="更多">⋯</button>
        </div>
        <div class="file-icon">📁</div>
        <div class="file-name">${escapeHtml(dirName)}</div>
        <div class="file-meta">文件夹</div>
      </div>`;
    });
    files.forEach(file => {
      const meta = file.metadata || file;
      const name = meta.FileName || file.name?.split('/').pop() || '未知';
      const size = meta.FileSizeBytes ? formatSize(parseInt(meta.FileSizeBytes)) : (meta.FileSize ? meta.FileSize + ' MB' : '');
      const time = formatDate(meta.TimeStamp);
      const fileId = encodeURIComponent(file.name || file.id);
      const fileType = meta.FileType || '';
      const isImage = fileType.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(name);
      const thumbUrl = isImage ? `${API_BASE}/file/${fileId}?from=admin` : '';
      const iconHtml = isImage
        ? `<div class="file-thumb" style="background-image:url('${thumbUrl}')"></div>`
        : `<div class="file-icon">${getFileIcon(name, fileType)}</div>`;
      const clickAction = isImage ? `previewFile('${fileId}', '${escapeHtml(name)}')` : `showFileMenu('${fileId}', '${escapeHtml(name)}')`;
      const isSelected = selectedFiles.has(file.name || file.id) ? 'selected' : '';
      const checked = selectedFiles.has(file.name || file.id) ? 'checked' : '';
      html += `<div class="file-card ${isSelected}" onclick="${clickAction}" oncontextmenu="event.preventDefault();showFileContextMenu(event,'${fileId}','${escapeHtml(name)}')">
        <input type="checkbox" class="file-checkbox" ${checked} onclick="event.stopPropagation();toggleFileSelection('${file.name || file.id}')">
        <div class="file-actions">
          <button class="btn-icon" onclick="event.stopPropagation();downloadFile('${fileId}')" title="下载">⬇️</button>
          <button class="btn-icon" onclick="event.stopPropagation();showShareModal('${fileId}', '${escapeHtml(name)}')" title="分享">🔗</button>
          <button class="btn-icon" onclick="event.stopPropagation();showFileContextMenu(event,'${fileId}','${escapeHtml(name)}')" title="更多">⋯</button>
        </div>
        ${iconHtml}
        <div class="file-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
        <div class="file-meta">${size}</div>
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  } else {
    let html = '<table class="file-table"><thead><tr><th style="width:30px"></th><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>';
    directories.forEach(dir => {
      const dirName = dir.split('/').filter(p => p).pop();
      const dirEncoded = encodeURIComponent(dir);
      html += `<tr onclick="enterDir('${dirEncoded}')" oncontextmenu="event.preventDefault();showDirContextMenu(event,'${dirEncoded}','${escapeHtml(dirName)}')">
        <td></td>
        <td class="col-name"><span class="col-icon">📁</span>${escapeHtml(dirName)}</td>
        <td>-</td><td>-</td>
        <td class="col-actions">
          <button class="btn-icon" onclick="event.stopPropagation();showDirContextMenu(event,'${dirEncoded}','${escapeHtml(dirName)}')" title="更多">⋯</button>
        </td>
      </tr>`;
    });
    files.forEach(file => {
      const meta = file.metadata || file;
      const name = meta.FileName || file.name?.split('/').pop() || '未知';
      const size = meta.FileSizeBytes ? formatSize(parseInt(meta.FileSizeBytes)) : (meta.FileSize ? meta.FileSize + ' MB' : '');
      const time = formatDate(meta.TimeStamp);
      const fileId = encodeURIComponent(file.name || file.id);
      const fileType = meta.FileType || '';
      const isImage = fileType.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(name);
      const nameClickAction = isImage ? `previewFile('${fileId}', '${escapeHtml(name)}')` : `downloadFile('${fileId}')`;
      const checked = selectedFiles.has(file.name || file.id) ? 'checked' : '';
      html += `<tr oncontextmenu="event.preventDefault();showFileContextMenu(event,'${fileId}','${escapeHtml(name)}')">
        <td><input type="checkbox" class="file-checkbox" ${checked} onclick="event.stopPropagation();toggleFileSelection('${file.name || file.id}')"></td>
        <td class="col-name"><span class="col-icon">${getFileIcon(name, fileType)}</span><span onclick="${nameClickAction}" style="cursor:pointer">${escapeHtml(name)}</span></td>
        <td>${size}</td><td>${time}</td>
        <td class="col-actions">
          <button class="btn-icon" onclick="downloadFile('${fileId}')" title="下载">⬇️</button>
          <button class="btn-icon" onclick="showShareModal('${fileId}', '${escapeHtml(name)}')" title="分享">🔗</button>
          <button class="btn-icon" onclick="showFileContextMenu(event,'${fileId}','${escapeHtml(name)}')" title="更多">⋯</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }
  updateBatchToolbar();
}

function enterDir(dirEncoded) {
  currentDir = decodeURIComponent(dirEncoded);
  if (!currentDir.endsWith('/')) currentDir += '/';
  loadFiles();
}

function toggleView() {
  viewMode = viewMode === 'grid' ? 'list' : 'grid';
  document.getElementById('viewToggle').textContent = viewMode === 'grid' ? '⊞' : '☰';
  loadFiles();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// 文件操作

async function downloadFile(fileIdEncoded) {
  const fileId = decodeURIComponent(fileIdEncoded);
  window.open(`${API_BASE}/file/${encodeURIComponent(fileId)}?from=admin`, '_blank');
}

// 图片预览 - 全屏查看
function previewFile(fileIdEncoded, fileName) {
  const fileId = decodeURIComponent(fileIdEncoded);
  const imgUrl = `${API_BASE}/file/${encodeURIComponent(fileId)}?from=admin`;
  const overlay = document.createElement('div');
  overlay.className = 'preview-overlay';
  overlay.onclick = () => overlay.remove();
  
  const content = document.createElement('div');
  content.className = 'preview-content';
  content.onclick = (e) => e.stopPropagation();
  
  const img = document.createElement('img');
  img.className = 'preview-img';
  img.alt = fileName || '';
  img.onload = () => content.classList.add('loaded');
  img.onerror = () => {
    content.classList.remove('loaded');
    const errDiv = document.createElement('div');
    errDiv.className = 'preview-error';
    errDiv.textContent = '图片加载失败';
    content.innerHTML = '';
    content.appendChild(errDiv);
  };
  img.src = imgUrl;
  
  const loading = document.createElement('div');
  loading.className = 'preview-loading';
  loading.textContent = '加载中...';
  
  const info = document.createElement('div');
  info.className = 'preview-info';
  info.textContent = fileName || '';
  
  const toolbar = document.createElement('div');
  toolbar.className = 'preview-toolbar';
  
  const dlBtn = document.createElement('button');
  dlBtn.className = 'btn btn-outline';
  dlBtn.textContent = '⬇️ 下载';
  dlBtn.onclick = () => window.open(imgUrl, '_blank');
  
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn btn-outline';
  closeBtn.textContent = '✕ 关闭';
  closeBtn.onclick = () => overlay.remove();
  
  toolbar.appendChild(dlBtn);
  toolbar.appendChild(closeBtn);
  content.appendChild(img);
  content.appendChild(loading);
  content.appendChild(info);
  content.appendChild(toolbar);
  overlay.appendChild(content);
  document.body.appendChild(overlay);
}

function showDirContextMenu(event, dirEncoded, dirName) {

  `;

}

function positionMenu(menu, event) {
  menu.classList.add('show');
  const x = event.clientX || (event.touches && event.touches[0].clientX) || 0;
  const y = event.clientY || (event.touches && event.touches[0].clientY) || 0;
  const rect = menu.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 10;
  const maxY = window.innerHeight - rect.height - 10;
  menu.style.left = Math.min(x, maxX) + 'px';
  menu.style.top = Math.min(y, maxY) + 'px';
}

function hideContextMenu() {
  document.getElementById('contextMenu').classList.remove('show');
}

document.addEventListener('click', () => hideContextMenu());

function showRenameModal(fileIdEncoded, fileName) {
  const fileId = decodeURIComponent(fileIdEncoded);
  const dirPath = fileId.includes('/') ? fileId.substring(0, fileId.lastIndexOf('/') + 1) : '';
  const currentName = fileId.split('/').pop();
  
  showModal('重命名', `
    <div style="text-align:center;margin-bottom:1rem">
      <div style="font-size:2rem">${getFileIcon(fileName)}</div>
    </div>
    <div class="modal-field">
      <label class="modal-label">新文件名</label>
      <input type="text" class="modal-input" id="renameInput" value="${escapeHtml(currentName)}" autofocus>
    </div>
    ${dirPath ? `<div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem">所在目录: ${escapeHtml(dirPath)}</div>` : ''}
  `, [
    { text: '取消', class: 'btn-outline', onclick: closeModal },
    { text: '确认重命名', class: 'btn-primary', onclick: () => doRename(fileId, dirPath) }
  ]);

    if (input) { input.focus(); input.select(); }

async function doRename(fileId, dirPath) {
  const newName = document.getElementById('renameInput').value.trim();
  if (!newName) { showToast('请输入新文件名', 'warning'); return; }
  
  const newFileId = dirPath ? dirPath + newName : newName;
  if (newFileId === fileId) { closeModal(); return; }
  
  closeModal();
  
  try {
    await apiFetch(`${API_BASE}/api/manage/rename/${encodeURIComponent(fileId)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
      body: JSON.stringify({ newFileId })
    });
    showToast('重命名成功', 'success');
    loadFiles();
  } catch (err) {
    showToast('重命名失败: ' + err.message, 'error');
  }
}

// 移动/复制
// ============================
function showMoveModal(fileIds, mode) {
  moveContext = { fileIds, mode };
  const title = mode === 'copy' ? '复制到文件夹' : '移动到文件夹';
  
  showModal(title, `
    <div class="dir-tree-current" id="moveCurrentDir">当前目录: <span id="moveSelectedDir">/ (根目录)</span></div>
    <div class="dir-tree-container" id="dirTreeContainer">
      <div style="text-align:center;padding:1rem;color:var(--muted)">加载目录树...</div>
    </div>
  `, [
    { text: '取消', class: 'btn-outline', onclick: closeModal },
    { text: mode === 'copy' ? '📋 复制' : '📂 移动', class: 'btn-primary', onclick: doMoveOrCopy }
  ]);
  
  loadDirTree('');
}

function showMoveDirModal(dirEncoded, dirName) {
  const dirPath = decodeURIComponent(dirEncoded);
  showMoveModal([dirPath + '/'], 'move');
}

async function loadDirTree(selectedPath) {
  try {
    const data = await apiFetch(`${API_BASE}/api/directoryTree`, { headers: getAuthHeaders() });
    const container = document.getElementById('dirTreeContainer');
    if (!container) return;
    
    let html = `<div class="dir-tree-node" onclick="selectMoveDir('')" data-path="">
      <span>📁</span><span>根目录</span>
    </div>`;
    
    function renderTree(node, depth) {
      if (!node || !node.children) return '';
      let result = '';
      for (const child of node.children) {
        const padding = 'margin-left:' + (depth * 20) + 'px';
        const name = child.name || child.path?.split('/').pop();
        const path = child.path || '';
        result += `<div class="dir-tree-node" style="${padding}" onclick="selectMoveDir('${encodeURIComponent(path)}')" data-path="${escapeHtml(path)}">
          <span>📁</span><span>${escapeHtml(name)}</span>
        </div>`;
        if (child.children && child.children.length > 0) {
          result += renderTree(child, depth + 1);
        }
      }
      return result;
    }
    
    if (data.tree) {
      html += renderTree(data.tree, 0);
    }
    
    container.innerHTML = html;
  } catch (err) {
    const container = document.getElementById('dirTreeContainer');
    if (container) container.innerHTML = `<div style="color:var(--danger);padding:1rem">加载失败: ${err.message}</div>`;
  }
}

function selectMoveDir(pathEncoded) {
  const path = decodeURIComponent(pathEncoded);
  moveContext.targetDir = path;
  document.getElementById('moveSelectedDir').textContent = path || '/ (根目录)';
  
  // 高亮选中
  document.querySelectorAll('.dir-tree-node').forEach(n => n.classList.remove('selected'));
  event?.target?.closest('.dir-tree-node')?.classList.add('selected');
}

async function doMoveOrCopy() {
  if (!moveContext || !moveContext.fileIds) return;
  const targetDir = moveContext.targetDir || '';
  const mode = moveContext.mode;
  const fileIds = moveContext.fileIds;
  
  closeModal();
  
  let successCount = 0;
  let failCount = 0;
  
  for (const fileId of fileIds) {
    try {
      const fileName = fileId.split('/').pop();
      const newFileId = targetDir ? `${targetDir}/${fileName}` : fileName;
      
      if (mode === 'copy') {
        await apiFetch(`${API_BASE}/api/manage/copy/${encodeURIComponent(fileId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
          body: JSON.stringify({ targetDir })
        });
      } else {
        await apiFetch(`${API_BASE}/api/manage/move/${encodeURIComponent(fileId)}?dist=${encodeURIComponent(targetDir)}`, {
          headers: getAuthHeaders()
        });
      }
      successCount++;
    } catch (err) {
      console.error(`Failed to ${mode} ${fileId}:`, err);
      failCount++;
    }
  }
  
  if (failCount === 0) {
    showToast(`${mode === 'copy' ? '复制' : '移动'}成功 ${successCount} 项`, 'success');
  } else if (successCount > 0) {
    showToast(`${mode === 'copy' ? '复制' : '移动'} ${successCount} 项成功, ${failCount} 项失败`, 'warning');
  } else {
    showToast(`${mode === 'copy' ? '复制' : '移动'}失败: ${failCount} 项`, 'error');
  }
  
  if (mode === 'move') loadFiles();
}

async function deleteDir(dirEncoded, dirName) {
  if (!confirm(`确定删除文件夹 "${dirName}" 及其中所有文件吗?\n文件将移入回收站。`)) return;
  try {
    await apiFetch(`${API_BASE}/api/manage/delete/${dirEncoded}?folder=true&trash=true`, {
      method: 'DELETE',
      headers: getAuthHeaders()
    });
    showToast('文件夹已移入回收站', 'success');
    loadFiles();
  } catch (err) {
    showToast('删除失败: ' + err.message, 'error');
  }
}

// ============================
// 批量操作
// ============================
function toggleFileSelection(fileId) {
  if (selectedFiles.has(fileId)) {
    selectedFiles.delete(fileId);
  } else {
    selectedFiles.add(fileId);
  }
  updateBatchToolbar();
  // 更新全选复选框状态
  const allFileIds = lastRenderedFiles.map(f => f.name || f.id);
  const allSelected = allFileIds.length > 0 && allFileIds.every(id => selectedFiles.has(id));
  const selectAllCheckbox = document.getElementById('selectAllCheckbox');
  if (selectAllCheckbox) selectAllCheckbox.checked = allSelected;
}

function toggleSelectAll(checked) {
  const allFileIds = lastRenderedFiles.map(f => f.name || f.id);
  if (checked) {
    allFileIds.forEach(id => selectedFiles.add(id));
  } else {
    allFileIds.forEach(id => selectedFiles.delete(id));
  }
  loadFiles(); // 重新渲染以更新复选框状态
}

function updateBatchToolbar() {
  const toolbar = document.getElementById('batchToolbar');
  const countEl = document.getElementById('batchCount');
  if (!toolbar || !countEl) return;
  
  const count = selectedFiles.size;
  if (count > 0) {
    toolbar.classList.add('show');
    countEl.textContent = `已选 ${count} 项`;
  } else {
    toolbar.classList.remove('show');
  }
}

function clearBatchSelection() {
  selectedFiles.clear();
  const selectAllCheckbox = document.getElementById('selectAllCheckbox');
  if (selectAllCheckbox) selectAllCheckbox.checked = false;
  loadFiles();
}

function getSelectedFileIds() {
  return Array.from(selectedFiles);
}

async function batchDelete() {
  const fileIds = getSelectedFileIds();
  if (fileIds.length === 0) return;
  if (!confirm(`确定删除选中的 ${fileIds.length} 个文件吗?\n文件将移入回收站。`)) return;
  
  try {
    const resp = await apiFetch(`${API_BASE}/api/manage/delete/batch?trash=true`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
      body: JSON.stringify({ fileIds })
    });
    
    const deleted = resp.deleted || [];
    const failed = resp.failed || [];
    
    if (failed.length === 0) {
      showToast(`成功删除 ${deleted.length} 个文件`, 'success');
    } else {
      showToast(`删除 ${deleted.length} 个成功, ${failed.length} 个失败`, 'warning');
    }
    clearBatchSelection();
    loadFiles();
  } catch (err) {
    showToast('批量删除失败: ' + err.message, 'error');
  }
}

function batchMove() {
  const fileIds = getSelectedFileIds();
  if (fileIds.length === 0) return;
  showMoveModal(fileIds, 'move');
}

function batchCopy() {
  const fileIds = getSelectedFileIds();
  if (fileIds.length === 0) return;
  showMoveModal(fileIds, 'copy');
}

async function batchShare() {
  const fileIds = getSelectedFileIds();
  if (fileIds.length === 0) return;
  if (!confirm(`为选中的 ${fileIds.length} 个文件创建分享链接?`)) return;
  
  let successCount = 0;
  for (const fileId of fileIds) {
    try {
      const resp = await apiFetch(`${API_BASE}/api/manage/share/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
        body: JSON.stringify({ fileId })
      });
      successCount++;
    } catch (err) {
      console.error(`Share failed for ${fileId}:`, err);
    }
  }
  showToast(`成功创建 ${successCount} 个分享链接`, 'success');
  clearBatchSelection();
}

// 回收站
// ============================
async function loadTrash() {
  const container = document.getElementById('trashContainer');
  container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">加载中...</div>';
  
  try {
    const data = await apiFetch(`${API_BASE}/api/manage/trash/`, { headers: getAuthHeaders() });
    const items = data.items || [];
    
    if (items.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🗑️</div><div>回收站为空</div></div>';
      return;
    }
    
    let html = '';
    items.forEach(item => {
      const meta = item.metadata || {};
      const name = meta.FileName || item.fileId?.split('/').pop() || '未知';
      const size = meta.FileSizeBytes ? formatSize(parseInt(meta.FileSizeBytes)) : (meta.FileSize ? meta.FileSize + ' MB' : '');
      const trashTime = formatDate(item.trashTime);
      const fileIdEncoded = encodeURIComponent(item.fileId);
      html += `<div class="trash-item">
        <div style="font-size:1.5rem">${getFileIcon(name)}</div>
        <div class="trash-item-info">
          <div class="trash-item-name">${escapeHtml(name)}</div>
          <div class="trash-item-meta">${size} · 删除于 ${trashTime}</div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="restoreFile('${fileIdEncoded}')" title="恢复">↩️ 恢复</button>
        <button class="btn btn-danger btn-sm" onclick="permanentDelete('${fileIdEncoded}','${escapeHtml(name)}')" title="彻底删除">🗑️</button>
      </div>`;
    });
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>加载失败: ${err.message}</div></div>`;
  }
}

async function restoreFile(fileIdEncoded) {
  try {
    await apiFetch(`${API_BASE}/api/manage/trash/${fileIdEncoded}`, {
      method: 'POST',
      headers: getAuthHeaders()
    });
    showToast('文件已恢复', 'success');
    loadTrash();
  } catch (err) {
    showToast('恢复失败: ' + err.message, 'error');
  }
}

async function permanentDelete(fileIdEncoded, fileName) {
  if (!confirm(`确定彻底删除 "${fileName}" 吗?\n此操作不可恢复!`)) return;
  try {
    await apiFetch(`${API_BASE}/api/manage/trash/${fileIdEncoded}`, {
      method: 'DELETE',
      headers: getAuthHeaders()
    });
    showToast('已彻底删除', 'success');
    loadTrash();
  } catch (err) {
    showToast('删除失败: ' + err.message, 'error');
  }
}

async function emptyTrash() {
  if (!confirm('确定清空回收站吗?\n所有文件将被彻底删除,此操作不可恢复!')) return;
  try {
    const data = await apiFetch(`${API_BASE}/api/manage/trash/`, { headers: getAuthHeaders() });
    const items = data.items || [];
    
    let successCount = 0;
    for (const item of items) {
      try {
        await apiFetch(`${API_BASE}/api/manage/trash/${encodeURIComponent(item.fileId)}`, {
          method: 'DELETE',
          headers: getAuthHeaders()
        });
        successCount++;
      } catch (e) {
        console.error('Failed to delete:', item.fileId, e);
      }
    }
    showToast(`已清空回收站 (${successCount} 项)`, 'success');
    loadTrash();
  } catch (err) {
    showToast('清空失败: ' + err.message, 'error');
  }
}

async function uploadFile(file) {
  const uploadId = `upload-item-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
  const isChunked = file.size > CHUNK_SIZE;
  
  // 断点续传: 检查是否有未完成的上传
  let resumedUploadId = null;
  let resumedCompletedChunks = [];
  if (isChunked) {
    const resumeInfo = getResumeInfo(file);
    if (resumeInfo) {
      // 查询后端该上传会话是否还有效,以及已完成的分片
      try {
        const resp = await apiFetch(`${API_BASE}/api/manage/chunkStatus?uploadId=${resumeInfo.uploadId}&totalChunks=${totalChunks}`, {
          headers: getAuthHeaders()
        });
        if (resp.valid && resp.completedCount > 0 && resp.completedCount < totalChunks) {
          resumedUploadId = resumeInfo.uploadId;
          resumedCompletedChunks = resp.completedChunks;
          showToast(`检测到未完成的上传,从 ${resp.completedCount}/${totalChunks} 继续`, 'info');
        } else if (resp.valid && resp.completedCount === totalChunks) {
          // 所有分片已完成,直接合并
          showToast('所有分片已上传,正在合并...', 'info');
          // 走正常合并流程
        } else {
          // 会话过期,清除记录
          clearResumeInfo(file);
        }
      } catch (e) {
        console.warn('检查断点续传失败:', e.message);
      }
    }
  }
  
  // 创建上传项 UI
  const uploadList = document.getElementById('uploadList');
  const item = document.createElement('div');
  item.className = 'upload-item';
  item.id = uploadId;
  const initialPercent = resumedCompletedChunks.length > 0 ? (resumedCompletedChunks.length / totalChunks * 95) : 0;
  const initialStatus = resumedCompletedChunks.length > 0 ? `续传中 ${resumedCompletedChunks.length}/${totalChunks}` : (isChunked ? `${formatSize(file.size)} · 分片上传 ${totalChunks} 片` : `${formatSize(file.size)} · 直传`);
  item.innerHTML = `
    <div style="font-size:1.5rem">${getFileIcon(file.name)}</div>
    <div class="upload-item-info">
      <div class="upload-item-name">${escapeHtml(file.name)}</div>
      <div class="upload-item-status">${initialStatus}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${initialPercent}%"></div></div>
    </div>
    <div class="upload-item-status" style="min-width:60px;text-align:right">${Math.round(initialPercent)}%</div>
    ${resumedUploadId ? `<button class="btn-icon" onclick="cancelResume('${escapeHtml(file.name)}')" title="取消续传" style="margin-left:8px">✕</button>` : ''}
  `;
  uploadList.appendChild(item);
  
  const updateProgress = (percent, status, done = false, error = false) => {
    const fill = item.querySelector('.progress-fill');
    const statusEl = item.querySelectorAll('.upload-item-status')[1];
    fill.style.width = percent + '%';
    if (done) fill.classList.add('success');
    if (error) fill.classList.add('error');
    statusEl.textContent = Math.round(percent) + '%';
    if (status) item.querySelectorAll('.upload-item-status')[0].textContent = status;
  };
  
  try {
    if (isChunked) {
      await chunkedUpload(file, totalChunks, updateProgress, resumedUploadId, resumedCompletedChunks);
    } else {
      await directUpload(file, updateProgress);
    }
    updateProgress(100, '上传完成', true);
    showToast(`${file.name} 上传成功`, 'success');
    // 上传成功,清除续传记录
    if (isChunked) clearResumeInfo(file);
  } catch (err) {
    updateProgress(0, '失败: ' + err.message, false, true);
    showToast(`${file.name} 上传失败: ${err.message}`, 'error');
  }
  
  // 3秒后移除成功项
  setTimeout(() => {
    if (item.querySelector('.progress-fill').classList.contains('success')) {
      item.style.transition = 'opacity 0.5s';
      item.style.opacity = '0';
      setTimeout(() => item.remove(), 500);
    }
  }, 3000);
}

// ============================
// 断点续传: localStorage 管理
// ============================
function getResumeInfo(file) {
  try {
    const key = `resume_${file.name}_${file.size}`;
    const data = localStorage.getItem(key);
    if (!data) return null;
    const info = JSON.parse(data);
    // 超过 50 分钟的记录视为过期(后端会话 1 小时过期)
    if (Date.now() - info.timestamp > 50 * 60 * 1000) {
      localStorage.removeItem(key);
      return null;
    }
    return info;
  } catch {
    return null;
  }
}

function saveResumeInfo(file, uploadId) {
  try {
    const key = `resume_${file.name}_${file.size}`;
    localStorage.setItem(key, JSON.stringify({
      uploadId,
      timestamp: Date.now()
    }));
  } catch (e) {
    console.warn('保存续传信息失败:', e.message);
  }
}

function clearResumeInfo(file) {
  try {
    const key = `resume_${file.name}_${file.size}`;
    localStorage.removeItem(key);
  } catch {}
}

function cancelResume(fileName) {
  if (!confirm('取消续传? 将清除该文件的上传进度记录')) return;
  // 清除所有匹配该文件名的续传记录
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const key = localStorage.key(i);
    if (key && key.startsWith('resume_') && key.includes(fileName)) {
      localStorage.removeItem(key);
    }
  }
  showToast('已取消续传,重新选择文件将重新上传', 'info');
}

async function chunkedUpload(file, totalChunks, updateProgress, resumedUploadId = null, completedChunks = []) {
  // Step 1: 初始化(或复用已有会话)
  let uploadId;
  const completedSet = new Set(completedChunks);
  
  if (resumedUploadId) {
    // 断点续传: 复用已有的 uploadId
    uploadId = resumedUploadId;
    updateProgress((completedSet.size / totalChunks) * 95, `续传中 ${completedSet.size}/${totalChunks}`);
  } else {
    // 新上传: 初始化
    updateProgress(0, '初始化上传...');
    let formData = new FormData();
    formData.append('originalFileName', file.name);
    formData.append('originalFileType', file.type || 'application/octet-stream');
    formData.append('totalChunks', totalChunks);
    
    const initResp = await apiFetch(`${API_BASE}/upload?initChunked=true&uploadChannel=telegram`, {
      method: 'POST', body: formData, headers: getAuthHeaders()
    });
    
    uploadId = initResp.uploadId;
  }
  
  // 保存续传信息到 localStorage
  saveResumeInfo(file, uploadId);
  
  // Step 2: 逐片上传(并发 2 片,大文件降低并发避免超时)
  let uploadedCount = completedSet.size;
  updateProgress((uploadedCount / totalChunks) * 95, uploadedCount > 0 ? `上传中 ${uploadedCount}/${totalChunks}` : `上传中 0/${totalChunks}`);
  const concurrency = totalChunks > 100 ? 2 : 3;
  let nextChunk = 0;
  const failedChunks = [];
  
  // 上传单个分片(带409冲突处理和幂等性支持)
  async function uploadSingleChunkWithRetry(chunkIndex, chunkBlob, maxRetry = 5) {
    let retry = 0;
    while (retry < maxRetry) {
      try {
        const chunkFormData = new FormData();
        chunkFormData.append('file', chunkBlob);
        chunkFormData.append('chunkIndex', chunkIndex);
        chunkFormData.append('totalChunks', totalChunks);
        chunkFormData.append('uploadId', uploadId);
        chunkFormData.append('originalFileName', file.name);
        chunkFormData.append('originalFileType', file.type || 'application/octet-stream');
        
        // 使用 fetch 直接调用,以便处理 409 等特殊状态码
        const resp = await fetch(`${API_BASE}/upload?chunked=true&uploadChannel=telegram`, {
          method: 'POST', body: chunkFormData, credentials: 'include',
          headers: getAuthHeaders()
        });
        const text = await resp.text();
        let data;
        try { data = JSON.parse(text); } catch { data = text; }
        
        if (resp.ok) {
          // 上传成功(包括 alreadyCompleted 幂等性返回)
          uploadedCount++;
          const percent = (uploadedCount / totalChunks) * 95;
          updateProgress(percent, `上传中 ${uploadedCount}/${totalChunks}`);
          return true;
        }
        
        if (resp.status === 409 && data?.inProgress) {
          // 分片正在上传中(服务端正在处理),等待后重试
          const waitSec = data.retryAfter || 10;
          console.log(`分片 ${chunkIndex + 1} 服务端正在上传,等待 ${waitSec}s...`);
          await new Promise(r => setTimeout(r, waitSec * 1000));
          retry++;
          continue;
        }
        
        throw new Error(data?.error || data?.message || `HTTP ${resp.status}`);
      } catch (err) {
        retry++;
        if (retry >= maxRetry) {
          console.warn(`分片 ${chunkIndex + 1} 失败 ${retry} 次,稍后重试: ${err.message}`);
          return false;
        }
        // 指数退避: 2s, 4s, 8s, 16s
        await new Promise(r => setTimeout(r, 2000 * Math.pow(2, retry - 1)));
      }
    }
    return false;
  }
  
  async function uploadOneChunk() {
    while (nextChunk < totalChunks) {
      const chunkIndex = nextChunk++;
      
      // 断点续传: 跳过已完成的分片
      if (completedSet.has(chunkIndex)) {
        continue;
      }
      
      const start = chunkIndex * CHUNK_SIZE;
      const end = Math.min(start + CHUNK_SIZE, file.size);
      const chunkBlob = file.slice(start, end);
      
      const success = await uploadSingleChunkWithRetry(chunkIndex, chunkBlob);
      if (!success) {
        failedChunks.push(chunkIndex);
      }
    }
  }
  
  // 并发上传
  const workers = [];
  for (let i = 0; i < concurrency; i++) workers.push(uploadOneChunk());
  await Promise.all(workers);
  
  // 重试之前失败的分片:先查询服务端实际状态,避免盲目重试导致重复上传
  if (failedChunks.length > 0) {
    updateProgress(95, `检查失败分片状态 ${failedChunks.length}/${totalChunks}...`);
    console.log(`查询 ${failedChunks.length} 个失败分片的服务端状态...`);
    
    // 查询服务端实际已完成分片
    let serverCompletedChunks = [];
    try {
      const statusResp = await apiFetch(`${API_BASE}/manage/chunkStatus?uploadId=${encodeURIComponent(uploadId)}&totalChunks=${totalChunks}`, {
        headers: getAuthHeaders()
      });
      if (statusResp && statusResp.valid && Array.isArray(statusResp.completedChunks)) {
        serverCompletedChunks = statusResp.completedChunks;
      }
    } catch (e) {
      console.warn('查询服务端分片状态失败,将直接重试:', e.message);
    }
    
    // 过滤出真正需要重试的分片(服务端未完成的)
    const chunksToRetry = failedChunks.filter(idx => !serverCompletedChunks.includes(idx));
    const serverCompletedCount = failedChunks.length - chunksToRetry.length;
    
    if (serverCompletedCount > 0) {
      console.log(`服务端已有 ${serverCompletedCount} 个分片完成,跳过重试`);
      uploadedCount += serverCompletedCount;
      updateProgress((uploadedCount / totalChunks) * 95, `跳过已完成 ${uploadedCount}/${totalChunks}`);
    }
    
    if (chunksToRetry.length === 0) {
      console.log('所有失败分片在服务端已完成,无需重试');
    } else {
      updateProgress(95, `重试失败分片 ${chunksToRetry.length}/${totalChunks}...`);
      console.log(`重试 ${chunksToRetry.length} 个失败分片...`);
      
      for (const chunkIndex of chunksToRetry) {
        const start = chunkIndex * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, file.size);
        const chunkBlob = file.slice(start, end);
        
        const success = await uploadSingleChunkWithRetry(chunkIndex, chunkBlob, 3);
        if (!success) {
          throw new Error(`分片 ${chunkIndex + 1} 重试 3 次后仍失败`);
        }
      }
    }
  }
  
  // Step 3: 合并
  updateProgress(96, '合并文件中...');
  const mergeFormData = new FormData();
  mergeFormData.append('uploadId', uploadId);
  mergeFormData.append('totalChunks', totalChunks);
  mergeFormData.append('originalFileName', file.name);
  mergeFormData.append('originalFileType', file.type || 'application/octet-stream');
  
  // 上传目录
  let mergeUrl = `${API_BASE}/upload?chunked=true&merge=true&uploadChannel=telegram&uploadNameType=origin`;
  if (currentDir) {
    mergeFormData.append('uploadFolder', currentDir);
  }
  
  // 合并请求也可能超时,加重试
  let mergeRetry = 0;
  const maxMergeRetry = 3;
  while (mergeRetry < maxMergeRetry) {
    try {
      await apiFetch(mergeUrl, {
        method: 'POST', body: mergeFormData, headers: getAuthHeaders()
      });
      break;
    } catch (err) {
      mergeRetry++;
      if (mergeRetry >= maxMergeRetry) throw new Error(`文件合并失败: ${err.message}`);
      updateProgress(96, `合并重试 ${mergeRetry}/${maxMergeRetry}...`);
      await new Promise(r => setTimeout(r, 3000 * mergeRetry));
    }
  }
  
  updateProgress(99, '完成');
}

async function directUpload(file, updateProgress) {
  updateProgress(0, '上传中...');
  const formData = new FormData();
  formData.append('file', file);
  
  let url = `${API_BASE}/upload?uploadNameType=origin&uploadChannel=telegram`;
  if (currentDir) url += `&uploadFolder=${encodeURIComponent(currentDir)}`;
  
  // 使用 XMLHttpRequest 跟踪进度
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) {
        updateProgress((e.loaded / e.total) * 95, '上传中...');
      }
    });
    xhr.addEventListener('load', () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          const resp = JSON.parse(xhr.responseText);
          if (Array.isArray(resp) && resp.length > 0 && resp[0].src) {
            resolve(resp);
          } else {
            reject(new Error(resp.error || '上传失败'));
          }
        } catch { reject(new Error('解析响应失败')); }
      } else {
        reject(new Error(`HTTP ${xhr.status}`));
      }
    });
    xhr.addEventListener('error', () => reject(new Error('网络错误')));
    xhr.open('POST', url);
    
    // 添加认证头
    const authHeaders = getAuthHeaders();
    for (const [key, val] of Object.entries(authHeaders)) {
      xhr.setRequestHeader(key, val);
    }
    xhr.send(formData);
  });
}

async function createShare() {
  if (!shareContext) return;
  const password = document.getElementById('sharePassword').value.trim() || undefined;
  const expiresIn = parseInt(document.getElementById('shareExpiry').value) || undefined;
  const downloadLimit = parseInt(document.getElementById('shareLimit').value) || undefined;
  
  closeModal();
  
  try {
    const resp = await apiFetch(`${API_BASE}/api/manage/share/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
      body: JSON.stringify({
        fileId: shareContext.fileId,
        password,
        expiresIn: expiresIn > 0 ? expiresIn : undefined,
        downloadLimit
      })
    });
    
    // 显示分享链接
    showModal('分享链接已创建', `
      <div style="text-align:center;margin-bottom:1rem">
        <div style="font-size:2rem">✅</div>
        <div style="font-weight:600;margin-top:0.3rem">${escapeHtml(shareContext.fileName)}</div>
      </div>
      ${password ? `<div style="margin-bottom:0.5rem;font-size:0.85rem;color:var(--muted)">访问密码: <strong style="color:var(--accent)">${escapeHtml(password)}</strong></div>` : ''}
      <div class="share-link-box">
        <input type="text" class="share-link-input" id="shareLinkInput" value="${resp.shareUrl}" readonly>
        <button class="btn btn-primary btn-sm" onclick="copyShareLink()">复制</button>
      </div>
    `, [
      { text: '关闭', class: 'btn-outline', onclick: closeModal }
    ]);
  } catch (err) {
    showToast('创建分享失败: ' + err.message, 'error');
  }
}

function copyShareLink() {
  const input = document.getElementById('shareLinkInput');
  input.select();
  document.execCommand('copy');
  showToast('链接已复制', 'success');
}

// ============================
// 分享管理
// ============================
async function loadShares() {
  const container = document.getElementById('sharesContainer');
  container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)">加载中...</div>';
  
  try {
    const data = await apiFetch(`${API_BASE}/api/manage/share/`, {
      headers: getAuthHeaders()
    });
    
    const shares = data.shares || [];
    if (shares.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔗</div><div>暂无分享链接</div><div style="font-size:0.8rem;margin-top:0.5rem">在文件列表中点击分享按钮即可创建</div></div>';
      return;
    }
    
    let html = '<table class="file-table"><thead><tr><th>文件名</th><th>创建时间</th><th>过期</th><th>下载</th><th>操作</th></tr></thead><tbody>';
    shares.forEach(share => {
      const expired = share.expiresAt && Date.now() > share.expiresAt;
      const expiryText = share.expiresAt ? formatDate(share.expiresAt) : '永久';
      html += `<tr>
        <td class="col-name"><span class="col-icon">${getFileIcon(share.fileName)}</span>${escapeHtml(share.fileName)}</td>
        <td>${formatDate(share.createdAt)}</td>
        <td>${expired ? '<span style="color:var(--danger)">已过期</span>' : expiryText}</td>
        <td>${share.downloadCount || 0}${share.downloadLimit ? '/' + share.downloadLimit : ''}</td>
        <td class="col-actions">
          <button class="btn-icon" onclick="copyShareUrl('${share.shareId}')" title="复制链接">📋</button>
          <button class="btn-icon" onclick="deleteShare('${share.shareId}')" title="删除">🗑️</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>加载失败: ${err.message}</div></div>`;
  }
}

function copyShareUrl(shareId) {
  const url = `${location.origin}/s/${shareId}`;
  navigator.clipboard.writeText(url).then(() => showToast('链接已复制', 'success'));
}

async function deleteShare(shareId) {
  if (!confirm('确定删除此分享链接吗?')) return;
  try {
    await apiFetch(`${API_BASE}/api/manage/share/${shareId}`, {
      method: 'DELETE', headers: getAuthHeaders()
    });
    showToast('已删除', 'success');
    loadShares();
  } catch (err) {
    showToast('删除失败: ' + err.message, 'error');
  }
}

// ============================
// 存储统计
// ============================
async function loadStorageStats() {
  try {
    const data = await apiFetch(`${API_BASE}/api/manage/list?action=info`, {
      headers: getAuthHeaders()
    });
    if (data.totalSizeMB !== undefined) {
      const totalGB = (data.totalSizeMB / 1024).toFixed(2);
      const percent = Math.min((data.totalSizeMB / (1024 * 10)) * 100, 100); // 假设 10GB 上限
      document.getElementById('storageFill').style.width = percent + '%';
      document.getElementById('storageText').textContent = `${totalGB} GB 已使用`;
    }
  } catch {}
}

// ============================
// Modal 系统
// ============================
function showModal(title, body, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  const footer = document.getElementById('modalFooter');
  footer.innerHTML = '';
  buttons.forEach(btn => {
    const el = document.createElement('button');
    el.className = 'btn ' + (btn.class || 'btn-primary');
    el.textContent = btn.text;
    el.onclick = btn.onclick;
    footer.appendChild(el);
  });
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// ============================
// 搜索
// ============================
let searchTimer;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (currentView === 'files') loadFiles();
  }, 300);
});

// ============================
// 初始化 - 先检查登录状态
// ============================
(async function init() {
  const valid = await checkSession();
  if (valid) {
    document.getElementById('loginOverlay').style.display = 'none';
    loadFiles();
    loadStorageStats();
  } else {
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('loginAuthCode').focus();
  }
})();
</script>
</body>
</html>
